name: Publish Escala de Proposito v1.4.34 Volunteer WhatsApp Menu

on:
  push:
    paths:
      - '.github/workflows/publish-v1434-volunteer-whatsapp-menu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.33 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.33 -p escala-de-proposito-cpanel.zip --dir base --clobber
          mkdir pkg
          unzip -q base/escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.33"
          sha256sum pkg/api/confirmation_router_v1311.php pkg/api/quiz_router_v131.php pkg/api/whatsapp_transport_v1424.php pkg/api/automation_v130.php > /tmp/core-before.sha

      - name: Add volunteer WhatsApp consultation menu
        run: |
          set -euo pipefail
          cp patches/v1434/volunteer_menu_v1434.php pkg/api/volunteer_menu_v1434.php
          cp patches/v1434/scale-day-pdf-v1434.php pkg/api/scale-day-pdf-v1434.php
          python scripts/patch-v1434-pending.py pkg
          cat > pkg/ATUALIZACAO-v1.4.34.md <<'EOF'
          # Escala de Propósito v1.4.34

          - Adiciona menu de autoatendimento do voluntário pelo WhatsApp quando não existem pendências.
          - `MENU` sem pendências oferece consulta das escalas confirmadas dos próximos 30 dias e dos repertórios.
          - Ao selecionar uma escala, o voluntário vê data, horário, culto, ministério/função e as músicas daquele dia.
          - Adiciona opção de receber o PDF da escala completa do culto/dia, incluindo departamentos, funções, voluntários, status e repertório.
          - O PDF usa token temporário e o sistema tenta enviar como documento; se a Evolution não aceitar mídia, envia link seguro de download.
          - Se existirem pendências de escala ou quiz, elas continuam tendo prioridade no MENU.
          - Mantém intacto o núcleo de confirmação/recusa 1 e 2 e a resiliência `Connection Closed` da v1.4.33.
          EOF

      - name: Validate v1.4.34
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.34"
          php -l pkg/api/pending_router_v1311.php >/dev/null
          php -l pkg/api/volunteer_menu_v1434.php >/dev/null
          php -l pkg/api/scale-day-pdf-v1434.php >/dev/null
          grep -Fq "volunteer_menu_v1434.php" pkg/api/pending_router_v1311.php
          grep -Fq "v1434_show_home" pkg/api/pending_router_v1311.php
          grep -Fq "próximos 30 dias" pkg/api/volunteer_menu_v1434.php
          grep -Fq "Receber o PDF" pkg/api/volunteer_menu_v1434.php
          grep -Fq "whatsapp_scale_pdf_tokens" pkg/api/scale-day-pdf-v1434.php
          sha256sum pkg/api/confirmation_router_v1311.php pkg/api/quiz_router_v131.php pkg/api/whatsapp_transport_v1424.php pkg/api/automation_v130.php > /tmp/core-after.sha
          diff -u /tmp/core-before.sha /tmp/core-after.sha
          grep -Fq 'volunteer-whatsapp-menu-v1.4.34' pkg/sw.js

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.34.txt

      - name: Publish v1.4.34
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.34 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.34 \
            escala-de-proposito-cpanel.zip \
            escalastop-cpanel.zip \
            SHA256-v1.4.34.txt \
            --target "$GITHUB_SHA" \
            --title 'Escala de Propósito v1.4.34' \
            --notes-file pkg/ATUALIZACAO-v1.4.34.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.34
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.34.txt
          retention-days: 30
