name: Publish Escala de Proposito v1.4.11 Profile Avatar Permission

on:
  push:
    paths:
      - '.github/workflows/publish-v1411-profile-avatar-permission.yml'
      - 'scripts/patch-v1411-profile-avatar-permission.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.10 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.10 -p escala-de-proposito-cpanel.zip --clobber
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          mkdir pkg
          unzip -q escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.10"

      - name: Fix volunteer profile avatar upload
        run: |
          set -euo pipefail
          python3 scripts/patch-v1411-profile-avatar-permission.py pkg
          printf '1.4.11\n' > pkg/VERSION
          cat > pkg/ATUALIZACAO-v1.4.11.md <<'EOF'
          # Escala de Propósito v1.4.11

          - Corrige o erro "Sem permissão para esta alteração" ao voluntário ou líder enviar a própria foto de perfil.
          - O upload continua restrito à própria conta autenticada: cada usuário só pode alterar a sua própria foto.
          - A URL da foto agora é gravada diretamente pelo endpoint seguro de upload, sem depender da permissão genérica de edição de perfil.
          - Mantém validação de JPG, PNG ou WEBP e limite máximo de 2 MB.
          - Atualiza o cartão do perfil imediatamente depois do envio e mantém a foto salva para os próximos acessos.
          - Atualiza o cache do PWA para computadores e celulares receberem a correção.
          - Mantém todos os recursos da v1.4.10.
          EOF

      - name: Validate v1.4.11
        run: |
          set -euo pipefail
          php -l pkg/api/upload.php
          node --check pkg/assets/index-C6Ng0a8i.js
          python3 -m py_compile scripts/patch-v1411-profile-avatar-permission.py
          test "$(cat pkg/VERSION)" = "1.4.11"
          grep -Fq "UPDATE profiles SET avatar_url=? WHERE id=?" pkg/api/upload.php
          grep -Fq "Você só pode enviar sua própria foto" pkg/api/upload.php
          ! grep -Fq 'I.from("profiles").update({avatar_url:Fe}).eq("id",e.id)' pkg/assets/index-C6Ng0a8i.js
          grep -Fq '/assets/index-C6Ng0a8i.js?v=1.4.11' pkg/sistema.html
          grep -Fq 'profile-avatar-permission-cache-bust-v1.4.11' pkg/sw.js
          grep -Fq "updateViaCache:'none'" pkg/registerSW.js

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.11.txt

      - name: Publish v1.4.11
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.11 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.11 \
            escala-de-proposito-cpanel.zip \
            escalastop-cpanel.zip \
            SHA256-v1.4.11.txt \
            --target "$GITHUB_SHA" \
            --title 'Escala de Propósito v1.4.11' \
            --notes-file pkg/ATUALIZACAO-v1.4.11.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.11
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.11.txt
          retention-days: 30
