name: Publish Escala de Proposito v1.4.2 Private Supabase Migrator

on:
  push:
    paths:
      - '.github/workflows/publish-v142-private-migrator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.1 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.1 -p escala-de-proposito-cpanel.zip --clobber
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          mkdir pkg
          unzip -q escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.1"

      - name: Add automatic private migration support
        run: |
          set -euo pipefail
          mkdir -p pkg/database/migrations
          cat > pkg/database/migrations/202609060001_supabase_compat_schema.sql <<'SQL'
          -- Escala Fácil / Escala de Propósito
          -- Estruturas necessárias para compatibilidade do backup Supabase 06/09/2026
          SET NAMES utf8mb4;
          SET FOREIGN_KEY_CHECKS=0;

          CREATE TABLE IF NOT EXISTS `whatsapp_menu_sessions` (
            `id` CHAR(36) NOT NULL,
            `voluntario_id` CHAR(36) NOT NULL,
            `igreja_id` CHAR(36) NULL DEFAULT NULL,
            `opcoes` LONGTEXT NOT NULL,
            `selecionado` LONGTEXT NULL,
            `status` VARCHAR(64) NOT NULL DEFAULT 'aguardando_escolha',
            `created_at` DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
            `updated_at` DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
            PRIMARY KEY (`id`),
            KEY `idx_whatsapp_menu_voluntario` (`voluntario_id`),
            KEY `idx_whatsapp_menu_igreja` (`igreja_id`),
            KEY `idx_whatsapp_menu_status` (`status`)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

          CREATE TABLE IF NOT EXISTS `whatsapp_confirmation_contexts` (
            `id` VARCHAR(36) NOT NULL PRIMARY KEY,
            `sender` VARCHAR(32) NOT NULL,
            `escala_item_id` VARCHAR(36) NOT NULL,
            `voluntario_id` VARCHAR(36) NOT NULL,
            `escala_id` VARCHAR(36) NOT NULL,
            `sent_at` DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
            `expires_at` DATETIME NOT NULL,
            `status` VARCHAR(20) NOT NULL DEFAULT 'active',
            `consumed_at` DATETIME NULL,
            `last_response` VARCHAR(500) NULL,
            `updated_at` DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
            UNIQUE KEY `uq_whatsapp_confirmation_item` (`escala_item_id`),
            KEY `idx_whatsapp_confirmation_sender` (`sender`,`status`,`expires_at`)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

          CREATE TABLE IF NOT EXISTS `whatsapp_pending_sessions` (
            `id` VARCHAR(36) NOT NULL PRIMARY KEY,
            `sender` VARCHAR(32) NOT NULL,
            `voluntario_id` VARCHAR(36) NULL,
            `state` VARCHAR(24) NOT NULL DEFAULT 'menu',
            `selected_type` VARCHAR(24) NULL,
            `selected_id` VARCHAR(64) NULL,
            `options_json` LONGTEXT NULL,
            `created_at` DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
            `expires_at` DATETIME NOT NULL,
            `updated_at` DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
            KEY `idx_whatsapp_pending_sender` (`sender`,`state`,`expires_at`),
            KEY `idx_whatsapp_pending_voluntario` (`voluntario_id`,`state`,`expires_at`)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

          SET FOREIGN_KEY_CHECKS=1;
          SQL

          cat > pkg/api/migration-import.php <<'PHP'
          <?php
          declare(strict_types=1);
          require __DIR__.'/bootstrap.php';

          $caller = require_auth();
          $ctx = user_context();
          if (($ctx['role'] ?? '') !== 'master') {
              out(['data'=>null,'error'=>['message'=>'Somente o MASTER pode executar a migração do Supabase.']],403);
          }

          const MIGRATION_ID = 'supabase-snapshot-20260906-private';
          const EXPECTED_DATA_SHA256 = 'b19e263602a9741aee64ad4ab3ce86ab7eecd0d8d9a64db962a5e53de2460de1';
          const EXPECTED_SCHEMA_SHA256 = '0344864e1c56bf482fdb41b337a8b2ba88fc3c5aa9a2e3a47d5de2a9c163cb6f';

          function mig_storage_dir(): string {
              $dir = __DIR__.'/../storage/migrations';
              if (!is_dir($dir) && !mkdir($dir,0750,true) && !is_dir($dir)) {
                  throw new RuntimeException('Não foi possível criar a pasta privada de migração.');
              }
              $ht = $dir.'/.htaccess';
              if (!is_file($ht)) {
                  @file_put_contents($ht,"Require all denied\nDeny from all\n");
              }
              return $dir;
          }

          function mig_ensure_marker_table(): void {
              db()->exec("CREATE TABLE IF NOT EXISTS system_migrations (id VARCHAR(190) PRIMARY KEY, applied_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci");
          }

          function mig_applied(): bool {
              mig_ensure_marker_table();
              $st = db()->prepare('SELECT 1 FROM system_migrations WHERE id=? LIMIT 1');
              $st->execute([MIGRATION_ID]);
              return (bool)$st->fetchColumn();
          }

          function mig_table_exists(string $table): bool {
              $st = db()->prepare('SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name=?');
              $st->execute([$table]);
              return (int)$st->fetchColumn() > 0;
          }

          function mig_counts(): array {
              $expected = [
                  'users'=>60,'profiles'=>60,'user_roles'=>60,'igrejas'=>2,'departamentos'=>15,
                  'departamento_voluntarios'=>176,'escalas'=>89,'escala_itens'=>125,
                  'notification_logs'=>794,'whatsapp_inbound_events'=>379,'whatsapp_send_jobs'=>156
              ];
              $rows=[];
              foreach ($expected as $table=>$min) {
                  $actual = mig_table_exists($table) ? (int)db()->query('SELECT COUNT(*) FROM `'.$table.'`')->fetchColumn() : 0;
                  $rows[]=['table'=>$table,'actual'=>$actual,'minimum'=>$min,'ok'=>$actual >= $min];
              }
              return $rows;
          }

          function mig_split_sql(string $sql): array {
              $out=[]; $buf=''; $quote=null; $escape=false; $lineComment=false; $blockComment=false;
              $len=strlen($sql);
              for ($i=0;$i<$len;$i++) {
                  $ch=$sql[$i]; $next=$i+1<$len?$sql[$i+1]:'';
                  if ($lineComment) {
                      if ($ch==="\n") { $lineComment=false; $buf.="\n"; }
                      continue;
                  }
                  if ($blockComment) {
                      if ($ch==='*' && $next==='/') { $blockComment=false; $i++; }
                      continue;
                  }
                  if ($quote !== null) {
                      $buf.=$ch;
                      if ($escape) { $escape=false; continue; }
                      if ($ch==='\\') { $escape=true; continue; }
                      if ($ch===$quote) {
                          if (($quote==="'" || $quote==='"') && $next===$quote) { $buf.=$next; $i++; continue; }
                          $quote=null;
                      }
                      continue;
                  }
                  if ($ch==='-' && $next==='-' && ($i===0 || ctype_space($sql[$i-1])) && ($i+2 >= $len || ctype_space($sql[$i+2]))) {
                      $lineComment=true; $i++; continue;
                  }
                  if ($ch==='#') { $lineComment=true; continue; }
                  if ($ch==='/' && $next==='*') { $blockComment=true; $i++; continue; }
                  if ($ch==="'" || $ch==='"' || $ch==='`') { $quote=$ch; $buf.=$ch; continue; }
                  if ($ch===';') {
                      $stmt=trim($buf);
                      if ($stmt!=='') $out[]=$stmt;
                      $buf='';
                      continue;
                  }
                  $buf.=$ch;
              }
              $stmt=trim($buf); if ($stmt!=='') $out[]=$stmt;
              return $out;
          }

          function mig_exec_sql(string $sql, string $label): int {
              $statements=mig_split_sql($sql);
              $done=0;
              foreach ($statements as $stmt) {
                  try {
                      db()->exec($stmt);
                      $done++;
                  } catch (Throwable $e) {
                      if (db()->inTransaction()) { try { db()->rollBack(); } catch (Throwable $ignored) {} }
                      try { db()->exec('SET FOREIGN_KEY_CHECKS=1'); } catch (Throwable $ignored) {}
                      throw new RuntimeException($label.' falhou na instrução '.($done+1).': '.$e->getMessage());
                  }
              }
              return $done;
          }

          function mig_backup_database(): string {
              $dir=mig_storage_dir().'/backups';
              if (!is_dir($dir) && !mkdir($dir,0750,true) && !is_dir($dir)) throw new RuntimeException('Não foi possível criar backup automático.');
              $path=$dir.'/mysql-before-supabase-'.date('Ymd-His').'.sql.gz';
              $gz=gzopen($path,'wb9');
              if (!$gz) throw new RuntimeException('Não foi possível abrir o arquivo de backup.');
              gzwrite($gz,"-- Backup automático antes da migração Supabase\nSET NAMES utf8mb4;\nSET FOREIGN_KEY_CHECKS=0;\n\n");
              $tables=db()->query('SHOW TABLES')->fetchAll(PDO::FETCH_COLUMN);
              foreach ($tables as $table) {
                  $safe=str_replace('`','``',(string)$table);
                  $create=db()->query('SHOW CREATE TABLE `'.$safe.'`')->fetch(PDO::FETCH_NUM);
                  if ($create && isset($create[1])) {
                      gzwrite($gz,"\n-- TABLE `{$safe}`\nDROP TABLE IF EXISTS `{$safe}`;\n".$create[1].";\n");
                  }
                  $st=db()->query('SELECT * FROM `'.$safe.'`');
                  $columns=null;
                  while ($row=$st->fetch(PDO::FETCH_ASSOC)) {
                      if ($columns===null) $columns=array_keys($row);
                      $vals=[];
                      foreach ($row as $v) $vals[]=$v===null?'NULL':db()->quote((string)$v);
                      $colSql=implode(',',array_map(fn($c)=>'`'.str_replace('`','``',(string)$c).'`',$columns));
                      gzwrite($gz,'INSERT INTO `'.$safe.'` ('.$colSql.') VALUES ('.implode(',',$vals).");\n");
                  }
              }
              gzwrite($gz,"\nSET FOREIGN_KEY_CHECKS=1;\n");
              gzclose($gz);
              return $path;
          }

          $action=(string)($_GET['action'] ?? $_POST['action'] ?? 'status');

          try {
              if ($action==='status') {
                  out(['data'=>['success'=>true,'applied'=>mig_applied(),'counts'=>mig_counts(),'version'=>is_file(__DIR__.'/../VERSION')?trim((string)file_get_contents(__DIR__.'/../VERSION')):''],'error'=>null]);
              }
              if ($action!=='migrate') out(['data'=>null,'error'=>['message'=>'Ação inválida']],400);
              if (mig_applied()) out(['data'=>['success'=>true,'already_applied'=>true,'counts'=>mig_counts()],'error'=>null]);
              if (!class_exists('ZipArchive')) throw new RuntimeException('A extensão ZipArchive do PHP é necessária para a migração automática.');
              if (!isset($_FILES['package']) || !is_uploaded_file($_FILES['package']['tmp_name'])) throw new RuntimeException('Selecione o pacote privado de migração.');
              if ((int)($_FILES['package']['size'] ?? 0) > 20*1024*1024) throw new RuntimeException('Pacote maior que 20 MB.');

              $zip=new ZipArchive();
              if ($zip->open($_FILES['package']['tmp_name'])!==true) throw new RuntimeException('O arquivo enviado não é um ZIP válido.');
              $schema=$zip->getFromName('01-estrutura-compatibilidade.sql');
              $data=$zip->getFromName('02-dados-supabase-260906-MERGE.sql');
              $zip->close();
              if (!is_string($schema) || !is_string($data)) throw new RuntimeException('Este não é o pacote privado de migração esperado.');
              if (!hash_equals(EXPECTED_SCHEMA_SHA256,hash('sha256',$schema)) || !hash_equals(EXPECTED_DATA_SHA256,hash('sha256',$data))) {
                  throw new RuntimeException('A assinatura do pacote não confere. Use exatamente o pacote privado gerado para o backup de 06/09/2026.');
              }

              $backup=mig_backup_database();
              $schemaCount=mig_exec_sql($schema,'Estrutura');
              $dataCount=mig_exec_sql($data,'Dados');
              try { db()->exec('SET FOREIGN_KEY_CHECKS=1'); } catch (Throwable $ignored) {}

              $counts=mig_counts();
              $failed=array_values(array_filter($counts,fn($r)=>empty($r['ok'])));
              if ($failed) throw new RuntimeException('A importação terminou, mas a validação encontrou totais abaixo do backup esperado. O backup automático do MySQL foi preservado.');

              mig_ensure_marker_table();
              db()->prepare('INSERT INTO system_migrations(id,applied_at) VALUES(?,NOW()) ON DUPLICATE KEY UPDATE applied_at=VALUES(applied_at)')->execute([MIGRATION_ID]);
              audit($caller['id'],'supabase_private_migration','system_migration',['backup'=>basename($backup),'schema_statements'=>$schemaCount,'data_statements'=>$dataCount,'counts'=>$counts],'info');
              out(['data'=>['success'=>true,'migrated'=>true,'backup'=>basename($backup),'schema_statements'=>$schemaCount,'data_statements'=>$dataCount,'counts'=>$counts],'error'=>null]);
          } catch (Throwable $e) {
              try { audit($caller['id'],'supabase_private_migration_error','system_migration',['message'=>$e->getMessage()],'warning'); } catch (Throwable $ignored) {}
              out(['data'=>null,'error'=>['message'=>$e->getMessage()]],400);
          }
          PHP

          cat > pkg/migracao-supabase.html <<'HTML'
          <!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Migração Supabase · Escala de Propósito</title><style>
          :root{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#0f172a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:34px auto;padding:0 18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 10px 32px #0f172a0d;padding:24px;margin-bottom:18px}h1{margin:0 0 7px;font-size:28px}h2{font-size:18px}.muted{color:#64748b;line-height:1.55}.ok,.warn,.err{padding:13px 15px;border-radius:12px;margin:14px 0}.ok{background:#ecfdf5;color:#166534}.warn{background:#fff7ed;color:#9a3412}.err{background:#fef2f2;color:#991b1b}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:11px;background:#2563eb;color:white;padding:12px 17px;font-weight:700;cursor:pointer;text-decoration:none}.btn.secondary{background:#e2e8f0;color:#0f172a}.btn:disabled{opacity:.55;cursor:not-allowed}input[type=file]{width:100%;padding:14px;border:1px dashed #94a3b8;border-radius:12px;background:#f8fafc}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;border-bottom:1px solid #e2e8f0;padding:10px 8px}.pill{font-size:12px;font-weight:700;border-radius:999px;padding:4px 8px}.pill.ok{display:inline;background:#dcfce7;color:#166534}.pill.bad{background:#fee2e2;color:#991b1b}@media(max-width:600px){.wrap{margin:16px auto}.card{padding:18px}h1{font-size:23px}}
          </style></head><body><div class="wrap"><div class="card"><h1>Migração do Supabase</h1><p class="muted">Ferramenta privada do MASTER para trazer o snapshot de 06/09/2026 para o MySQL sem usar phpMyAdmin. Antes de alterar dados, o sistema cria um backup automático do banco atual.</p><div id="notice"></div><div class="row"><a class="btn secondary" href="/sistema.html">Voltar ao sistema</a><a class="btn secondary" href="/master-comercial.html">Gestão Master</a></div></div>
          <div class="card"><h2>1. Status</h2><div id="status" class="muted">Verificando...</div><div id="counts"></div></div>
          <div class="card"><h2>2. Pacote privado</h2><p class="muted">Selecione <strong>Escala-Facil-Migracao-Supabase-260906-PRIVADO.zip</strong>. O servidor verifica a assinatura do conteúdo antes de executar.</p><input id="file" type="file" accept=".zip,application/zip"><div class="warn">Não envie o arquivo para sites públicos. Ele contém dados reais do sistema. Nesta tela ele é enviado somente para a sua instalação.</div><div class="row"><button id="migrate" class="btn">Fazer migração automática</button></div></div></div>
          <script>
          const token=localStorage.getItem('escala-facil.auth-token');const notice=document.getElementById('notice'),statusEl=document.getElementById('status'),counts=document.getElementById('counts'),file=document.getElementById('file'),btn=document.getElementById('migrate');
          if(!token){location.href='/index.html'}
          function msg(text,type='ok'){notice.innerHTML=`<div class="${type}">${text}</div>`}
          async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:`Bearer ${token}`};const r=await fetch(url,opt);const j=await r.json().catch(()=>({error:{message:`HTTP ${r.status}`}}));if(!r.ok||j.error)throw new Error(j?.error?.message||`HTTP ${r.status}`);return j.data}
          function renderCounts(rows=[]){counts.innerHTML=`<table><thead><tr><th>Tabela</th><th>Atual</th><th>Mínimo do backup</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.table}</td><td>${r.actual}</td><td>${r.minimum}</td><td><span class="pill ${r.ok?'ok':'bad'}">${r.ok?'OK':'Pendente'}</span></td></tr>`).join('')}</tbody></table>`}
          async function load(){try{const d=await api('/api/migration-import.php?action=status');statusEl.innerHTML=`Versão do servidor: <strong>${d.version||'—'}</strong><br>Migração privada: <strong>${d.applied?'CONCLUÍDA':'PENDENTE'}</strong>`;renderCounts(d.counts);btn.disabled=!!d.applied;if(d.applied)msg('A migração do snapshot de 06/09/2026 já foi concluída.','ok')}catch(e){msg(e.message,'err');statusEl.textContent='Não foi possível consultar o status.'}}
          btn.onclick=async()=>{if(!file.files[0]){msg('Selecione o pacote privado de migração.','warn');return}if(!confirm('Executar agora? O sistema fará backup automático do MySQL e depois importará o snapshot do Supabase.'))return;btn.disabled=true;btn.textContent='Migrando... não feche esta tela';msg('Criando backup e migrando os dados. Aguarde; pode levar alguns minutos.','warn');try{const fd=new FormData();fd.append('action','migrate');fd.append('package',file.files[0]);const d=await api('/api/migration-import.php',{method:'POST',body:fd});msg(`Migração concluída. Backup automático: ${d.backup||'criado'}.`,'ok');renderCounts(d.counts);statusEl.innerHTML='Migração privada: <strong>CONCLUÍDA</strong>';btn.textContent='Migração concluída'}catch(e){msg(e.message,'err');btn.disabled=false;btn.textContent='Tentar novamente'}};
          load();
          </script></body></html>
          HTML

          python3 - <<'PY'
          from pathlib import Path
          p=Path('pkg/master-comercial.html')
          s=p.read_text()
          marker='<a class="btn secondary" href="/sistema.html">Voltar ao painel</a>'
          if marker in s and 'migracao-supabase.html' not in s:
              s=s.replace(marker, marker+'<a class="btn secondary" href="/migracao-supabase.html">Migração Supabase</a>',1)
          p.write_text(s)

          sw=Path('pkg/sw.js')
          if sw.exists():
              text=sw.read_text()
              text=text.replace('supabase-api','legacy-api-cache')
              sw.write_text(text)

          Path('pkg/VERSION').write_text('1.4.2\n')
          Path('pkg/ATUALIZACAO-v1.4.2.md').write_text('''# Escala de Propósito v1.4.2\n\n- Adiciona migração privada do snapshot Supabase de 06/09/2026 diretamente pelo painel MASTER, sem phpMyAdmin.\n- O botão normal de atualização instala automaticamente as estruturas de compatibilidade no MySQL.\n- A tela Migração Supabase aceita somente o pacote privado assinado gerado para este backup.\n- Antes da importação é criado um backup automático completo do MySQL em pasta protegida.\n- Valida usuários, perfis, igrejas, departamentos, escalas e filas de WhatsApp após a migração.\n- Nenhum dado privado do backup é publicado no GitHub; o pacote privado é enviado apenas para a própria instalação pelo MASTER.\n- Mantém todos os recursos da v1.4.1.\n''')
          PY

      - name: Validate v1.4.2
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.2"
          php -l pkg/api/migration-import.php
          grep -Fq 'Migração Supabase' pkg/master-comercial.html
          grep -Fq 'EXPECTED_DATA_SHA256' pkg/api/migration-import.php
          test -s pkg/database/migrations/202609060001_supabase_compat_schema.sql
          unzip -t escala-de-proposito-cpanel.zip >/dev/null 2>&1 || true

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.2.txt

      - name: Publish v1.4.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.2 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.2 \
            escala-de-proposito-cpanel.zip \
            escalastop-cpanel.zip \
            SHA256-v1.4.2.txt \
            --target "$GITHUB_SHA" \
            --title 'Escala de Propósito v1.4.2' \
            --notes-file pkg/ATUALIZACAO-v1.4.2.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.2
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.2.txt
          retention-days: 30
