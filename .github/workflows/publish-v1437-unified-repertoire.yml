name: Publish Escala de Proposito v1.4.37 Unified Repertoire

on:
  push:
    paths:
      - '.github/workflows/publish-v1437-unified-repertoire.yml'
      - 'scripts/patch-v1437-unified-repertoire.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.36 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.36 -p escala-de-proposito-cpanel.zip --dir base --clobber
          mkdir pkg
          unzip -q base/escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.36"

      - name: Unify repertoire by church day and service
        run: |
          set -euo pipefail
          python scripts/patch-v1437-unified-repertoire.py

      - name: Validate v1.4.37
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.37"
          php -l pkg/api/whatsapp_scale_message_v1421.php >/dev/null
          php -l pkg/api/volunteer_menu_v1435.php >/dev/null
          php -l pkg/api/scale-day-pdf-v1435.php >/dev/null
          grep -Fq "COUNT(si.musica_id) qtd" pkg/api/whatsapp_scale_message_v1421.php
          grep -Fq "BINARY e2.igreja_id=BINARY ? AND e2.data=? AND BINARY e2.culto_id=BINARY ?" pkg/api/whatsapp_scale_message_v1421.php
          grep -Fq "ORDER BY qtd DESC,criado DESC,s.id DESC" pkg/api/whatsapp_scale_message_v1421.php
          grep -Fq "WHERE BINARY si.setlist_id=BINARY ?" pkg/api/whatsapp_scale_message_v1421.php
          grep -Fq "v1421_same_day_repertoire" pkg/api/volunteer_menu_v1435.php
          grep -Fq "v1421_same_day_repertoire" pkg/api/scale-day-pdf-v1435.php
          grep -Fq "link_youtube" pkg/api/whatsapp_scale_message_v1421.php
          printf '\n/* unified-repertoire-v1.4.37 */\n' >> pkg/sw.js

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.37.txt

      - name: Publish v1.4.37
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.37 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.37 \
            escala-de-proposito-cpanel.zip \
            escalastop-cpanel.zip \
            SHA256-v1.4.37.txt \
            --target "$GITHUB_SHA" \
            --title 'Escala de Propósito v1.4.37' \
            --notes-file pkg/ATUALIZACAO-v1.4.37.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.37
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.37.txt
          retention-days: 30
