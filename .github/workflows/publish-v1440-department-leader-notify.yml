name: Publish Escala de Proposito v1.4.40 Department Leader Notify

on:
  push:
    paths:
      - '.github/workflows/publish-v1440-department-leader-notify.yml'
      - 'scripts/patch-v1440-department-leader-notify.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.39 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.39 -p escala-de-proposito-cpanel.zip --dir base --clobber
          mkdir pkg
          unzip -q base/escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.39"

      - name: Route responses to department leader
        run: |
          set -euo pipefail
          python scripts/patch-v1440-department-leader-notify.py

      - name: Validate v1.4.40
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.40"
          php -l pkg/api/scale_response_notify_v1417.php >/dev/null
          grep -Fq "e.departamento_id" pkg/api/scale_response_notify_v1417.php
          grep -Fq "department_leader_without_whatsapp" pkg/api/scale_response_notify_v1417.php
          grep -Fq "department_without_valid_leader" pkg/api/scale_response_notify_v1417.php
          grep -Fq "if(\$deptId!=='')" pkg/api/scale_response_notify_v1417.php
          grep -Fq "\$pastorId=v1417_admin_id" pkg/api/scale_response_notify_v1417.php
          python - <<'PY'
          from pathlib import Path
          s=Path('pkg/api/scale_response_notify_v1417.php').read_text()
          a=s.index('function v1417_recipient')
          b=s.index('function v1417_recently_sent',a)
          f=s[a:b]
          assert "created_by" not in f, 'criador ainda está na seleção de destinatário'
          assert f.index("$leader=v1417_profile") < f.index("$pastorId=v1417_admin_id"), 'líder não está antes do pastor'
          print('recipient routing ok')
          PY
          printf '\n/* department-leader-notify-v1.4.40 */\n' >> pkg/sw.js

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.40.txt

      - name: Publish v1.4.40
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.40 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.40 \
            escala-de-proposito-cpanel.zip \
            escalastop-cpanel.zip \
            SHA256-v1.4.40.txt \
            --target "$GITHUB_SHA" \
            --title 'Escala de Propósito v1.4.40' \
            --notes-file pkg/ATUALIZACAO-v1.4.40.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.40
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.40.txt
          retention-days: 30
