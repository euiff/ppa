name: Publish Escala de Proposito v1.4.57 Duplicate Guard

on:
  push:
    paths:
      - '.github/workflows/publish-v1457-duplicate-guard.yml'
      - 'scripts/patch-v1457-duplicate-guard.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.56 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.56 -p escala-de-proposito-cpanel.zip --dir base --clobber
          mkdir pkg
          unzip -q base/escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.56"

      - name: Apply duplicate protection
        run: |
          set -euo pipefail
          python scripts/patch-v1457-duplicate-guard.py

      - name: Validate v1.4.57
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.57"
          ASSET=$(find pkg/assets -maxdepth 1 -name 'index-*.js' | head -n 1)
          test -n "$ASSET"
          node --check "$ASSET"
          grep -Fq 'DEPARTAMENTO DUPLICADO' "$ASSET"
          grep -Fq 'ESCALA JÁ EXISTE' "$ASSET"
          grep -Fq 'Abrir o departamento que já existe' "$ASSET"
          grep -Fq 'Criar outro mesmo assim' "$ASSET"
          grep -Fq 'existingDeptKeys' "$ASSET"
          grep -Fq 'duplicado(s) foram ignorados' "$ASSET"
          grep -Fq 'data(s) duplicada(s) foram ignoradas' "$ASSET"
          grep -Fq 'Proteção contra escalas e departamentos duplicados' pkg/ATUALIZACAO-v1.4.57.md

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip SHA256-v1.4.57.txt
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.57.txt

      - name: Publish v1.4.57
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.57 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.57             escala-de-proposito-cpanel.zip             escalastop-cpanel.zip             SHA256-v1.4.57.txt             --target "$GITHUB_SHA"             --title 'Escala de Propósito v1.4.57'             --notes-file pkg/ATUALIZACAO-v1.4.57.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.57
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.57.txt
          retention-days: 30
