name: Publish Escala de Proposito v1.4.70 Full Scale Notification Controls

on:
  push:
    paths:
      - '.github/workflows/publish-v1470-full-scale-notification-controls.yml'
      - 'scripts/patch-v1470-full-scale-notification-controls.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.69 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.69 -p escala-de-proposito-cpanel.zip --dir base --clobber
          echo '93f7a728e9cb17dbd19dbf4fb73d93fdadd642e4ac8a6a8e8688b9e0271fc42d  base/escala-de-proposito-cpanel.zip' | sha256sum --check --strict
          mkdir pkg
          unzip -q base/escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.69"

      - name: Apply v1.4.70
        run: |
          set -euo pipefail
          python scripts/patch-v1470-full-scale-notification-controls.py

      - name: Validate v1.4.70
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.70"
          ASSET=$(find pkg/assets -maxdepth 1 -name 'index-*.js' | head -n 1)
          test -n "$ASSET"

          node --check "$ASSET"
          php -l pkg/api/app_notification_events_v1470.php
          php -l pkg/api/app-scale-resend-v1470.php
          php -l pkg/api/app-pending.php

          grep -Fq 'Reenviar Notificações' "$ASSET"
          grep -Fq 'Publicar e Notificar' "$ASSET"
          grep -Fq 'resendOneV1470' "$ASSET"
          grep -Fq 'app-scale-resend-v1470.php' "$ASSET"
          grep -Fq 'send-whatsapp' "$ASSET"
          grep -Fq 'app_notification_events' pkg/api/app_notification_events_v1470.php
          grep -Fq '/minha-escala/' pkg/api/app-pending.php
          grep -Fq "count'=>$pendingCount" pkg/api/app-pending.php
          grep -Eq 'src="/assets/index-[^"]+\.js\?v=1\.4\.70"' pkg/sistema.html
          grep -Fq '/app-notifications-v1465.js?v=1.4.70' pkg/sistema.html
          grep -Fq 'escala-version:1.4.70' pkg/sw.js

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip SHA256-v1.4.70.txt
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.70.txt

      - name: Publish v1.4.70
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.70 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.70             escala-de-proposito-cpanel.zip             escalastop-cpanel.zip             SHA256-v1.4.70.txt             --target "$GITHUB_SHA"             --title 'Escala de Propósito v1.4.70'             --notes-file pkg/ATUALIZACAO-v1.4.70.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.70
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.70.txt
          retention-days: 30
