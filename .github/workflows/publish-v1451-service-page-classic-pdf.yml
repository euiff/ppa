name: Publish Escala de Proposito v1.4.51 Service Page Classic PDF

on:
  push:
    paths:
      - '.github/workflows/publish-v1451-service-page-classic-pdf.yml'
      - 'scripts/patch-v1451-service-page-classic-pdf.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.50 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.50 -p escala-de-proposito-cpanel.zip --dir base --clobber
          mkdir pkg
          unzip -q base/escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.50"

      - name: Restore Page do Culto and keep classic PDF
        run: |
          set -euo pipefail
          python scripts/patch-v1451-service-page-classic-pdf.py

      - name: Validate v1.4.51
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.51"
          ASSET=$(find pkg/assets -maxdepth 1 -name 'index-*.js' | head -n 1)
          test -n "$ASSET"
          node --check "$ASSET"
          node --check pkg/subscription-guard.js
          php -l pkg/api/ministerial-hub.php
          grep -Fq 'children:"Página do culto"' "$ASSET"
          grep -Fq '/culto?data=' "$ASSET"
          grep -Fq 'Imprimir / PDF — mesmo modelo da Escala Completa' pkg/gestao-ministerial.html
          grep -Fq 'Gerar pelo modelo da Escala Completa' pkg/gestao-ministerial.html
          grep -Fq "top.location.href='/escala/'+encodeURIComponent(b.id)" pkg/gestao-ministerial.html
          grep -Fq 'Ue.output("blob")' "$ASSET"
          grep -Fq "s.status==='master'&&s.billing_owner" pkg/subscription-guard.js

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip SHA256-v1.4.51.txt
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.51.txt

      - name: Publish v1.4.51
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.51 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.51 \
            escala-de-proposito-cpanel.zip \
            escalastop-cpanel.zip \
            SHA256-v1.4.51.txt \
            --target "$GITHUB_SHA" \
            --title 'Escala de Propósito v1.4.51' \
            --notes-file pkg/ATUALIZACAO-v1.4.51.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.51
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.51.txt
          retention-days: 30
