name: Publish Escala de Proposito v1.4.50 Volunteer Billing Print Fix

on:
  push:
    paths:
      - '.github/workflows/publish-v1450-volunteer-billing-print-fix.yml'
      - 'scripts/patch-v1450-volunteer-billing-print-fix.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.49 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.49 -p escala-de-proposito-cpanel.zip --dir base --clobber
          mkdir pkg
          unzip -q base/escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.49"

      - name: Apply v1.4.50 fixes
        run: |
          set -euo pipefail
          python scripts/patch-v1450-volunteer-billing-print-fix.py

      - name: Validate v1.4.50
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.50"
          ASSET=$(find pkg/assets -maxdepth 1 -name 'index-*.js' | head -n 1)
          test -n "$ASSET"
          node --check "$ASSET"
          node --check pkg/subscription-guard.js
          php -l pkg/api/ministerial-hub.php
          grep -Fq "s.status==='master'&&s.billing_owner" pkg/subscription-guard.js
          grep -Fq 'children:"Escala completa"' "$ASSET"
          ! grep -Fq 'children:"Página do culto"' "$ASSET"
          grep -Fq "const De=window.open(\"\",\"_blank\",\"width=1100,height=800\")" "$ASSET"
          grep -Fq 'Ue.output("blob")' "$ASSET"
          grep -Fq "'id'=>\$scales[0]['id']" pkg/api/ministerial-hub.php
          grep -Fq 'Departamento</th><th>Função</th><th>Voluntário</th><th>Situação' "$ASSET"
          grep -Fq 'A4' pkg/ATUALIZACAO-v1.4.50.md

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip SHA256-v1.4.50.txt
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.50.txt

      - name: Publish v1.4.50
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.50 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.50 \
            escala-de-proposito-cpanel.zip \
            escalastop-cpanel.zip \
            SHA256-v1.4.50.txt \
            --target "$GITHUB_SHA" \
            --title 'Escala de Propósito v1.4.50' \
            --notes-file pkg/ATUALIZACAO-v1.4.50.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.50
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.50.txt
          retention-days: 30
