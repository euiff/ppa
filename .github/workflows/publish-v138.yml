name: Validate and publish Escalas Top v1.3.8

on:
  push:
    paths:
      - .github/workflows/publish-v138.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Recover exact package blob
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_BLOBS: 6836e3045b858a30c2b6918f4b966e67fbac2232 b7d934407bd19e7ef2bf88798f407e7a57865517 269c8ab77155d8616b25b963aeeb891f0c9fe713 28cbee68eb1501849614a557a492db20143ed4f3 3810f9948efcd8c60e818ee6aa5e03af83f378b1 ac9438717709e6dfe73a9ef154b50a037281181b
          PACKAGE_SHA256: 70adb502436b2556db7fc51dd6f5dcc5e11d38faf6713eb2897fa3c1dc4b5857
        run: |
          : > package.b64
          for blob in ${PACKAGE_BLOBS}; do
            gh api "/repos/${GITHUB_REPOSITORY}/git/blobs/${blob}" --jq .content \
              | tr -d '\n' | base64 --decode >> package.b64
          done
          base64 --decode package.b64 > escalastop-cpanel-v1.3.8.zip
          echo "${PACKAGE_SHA256}  escalastop-cpanel-v1.3.8.zip" | sha256sum --check --strict
          unzip -t escalastop-cpanel-v1.3.8.zip
          mkdir escalastop-v1.3.8
          unzip -q escalastop-cpanel-v1.3.8.zip -d escalastop-v1.3.8

      - name: Validate package structure and PHP syntax
        run: |
          test "$(cat escalastop-v1.3.8/VERSION)" = "1.3.8"
          test -f escalastop-v1.3.8/index.html
          test -f escalastop-v1.3.8/api/confirmation_router_v138.php
          test -f escalastop-v1.3.8/api/webhook-entry-v138.php
          test -f escalastop-v1.3.8/api/webhook_sync_v138.php
          find escalastop-v1.3.8/api -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          grep -Fq 'webhook-entry-v138.php' escalastop-v1.3.8/api/.htaccess
          grep -Fq "['MESSAGES_UPSERT','MESSAGES_UPDATE']" escalastop-v1.3.8/api/webhook_sync_v138.php
          grep -Fq "webhookByEvents'=>false" escalastop-v1.3.8/api/webhook_sync_v138.php
          grep -Fq "v138_sync_evolution_webhook" escalastop-v1.3.8/api/automation_v130.php
          grep -Fq "if(!\$fromMe&&is_file(__DIR__.'/quiz_router_v131.php'))" escalastop-v1.3.8/api/webhook-entry-v138.php
          grep -Fq "whatsapp-webhook-entry-v138.log" escalastop-v1.3.8/api/webhook-entry-v138.php
          grep -Fq "fromMe_confirmation_allowed" escalastop-v1.3.8/api/confirmation_router_v138.php

      - name: Run webhook regression tests
        env:
          WEBHOOK_TEST_B64: 
        run: |
          printf '%s' "${WEBHOOK_TEST_B64}" | base64 --decode > webhook-v138-test.php
          php webhook-v138-test.php

      - name: Publish official release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_SHA256: 70adb502436b2556db7fc51dd6f5dcc5e11d38faf6713eb2897fa3c1dc4b5857
        run: |
          if gh release view v1.3.8 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo 'Release v1.3.8 already exists' >&2
            exit 1
          fi
          cp escalastop-cpanel-v1.3.8.zip escalastop-cpanel.zip
          printf '%s\n' \
            'Escalas Top v1.3.8' \
            '' \
            '- Corrige a resposta 1/2 quando o teste usa o mesmo WhatsApp conectado à Evolution (fromMe).' \
            '- Impede o roteador do quiz de consumir silenciosamente o comando antes da confirmação de escala.' \
            '- Uma mensagem fromMe só é aceita quando existe uma notificação exata enviada pelo sistema para o mesmo telefone.' \
            '- Registra novamente o webhook MESSAGES_UPSERT na entrada direta v1.3.8.' \
            '- Adiciona log na porta de entrada para diagnosticar inclusive mensagens que ainda não chegaram ao roteador.' \
            '- Mantém quiz, trocas, justificativas, mapa, CRON e os demais recursos existentes.' \
            '- Pacote aprovado por lint PHP, regressão completa de fromMe e verificação de integridade do ZIP.' \
            '' \
            "SHA-256: ${PACKAGE_SHA256}" > release-notes.md
          gh release create v1.3.8 escalastop-cpanel.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title 'Escalas Top v1.3.8' \
            --notes-file release-notes.md
