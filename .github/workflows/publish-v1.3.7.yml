name: Publish Escalas Top v1.3.7

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-v1.3.7.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact tested package
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-1414-820e-b8e0-5882aac0eb39/raw?se=2026-10-06T00%3A18%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=f2d65f2f-08e3-5d6e-8b07-9d5123375a4f&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T10%3A50%3A04Z&ske=2026-10-06T10%3A50%3A04Z&sks=b&skv=2026-02-06&sig=DAEedk4NQcOPDNI00xZi9EhvOOSES%2BazjKyQdRsLqSM%3D' -o artifact.zip
          rm -rf artifact && mkdir artifact
          unzip -q artifact.zip -d artifact
          test -f artifact/escalastop-cpanel-v1.3.7.zip
          echo '16aa2735c738a174a77e7614cd8532301a1198aa2024b16ba4f4e2e1ba13a918  artifact/escalastop-cpanel-v1.3.7.zip' | sha256sum -c -
          unzip -t artifact/escalastop-cpanel-v1.3.7.zip
          test "$(unzip -p artifact/escalastop-cpanel-v1.3.7.zip VERSION | tr -d '\r\n')" = '1.3.7'
          cp artifact/escalastop-cpanel-v1.3.7.zip escalastop-cpanel.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          Escalas Top v1.3.7

          - Na Escala completa, pastor/admin e líder do departamento agora têm botões visíveis Trocar e Retirar em cada voluntário.
          - Trocar mantém a mesma função, retira o voluntário anterior e coloca o substituto como Pendente.
          - Em escala publicada, o substituto recebe a notificação automaticamente.
          - Ao preencher vaga ou adicionar função/voluntário em uma escala publicada, o novo voluntário também é notificado automaticamente.
          - Layout dos controles é responsivo para computador e celular.
          - Mantém as correções do WhatsApp/confirmacão da v1.3.6.
          
          SHA-256: 16aa2735c738a174a77e7614cd8532301a1198aa2024b16ba4f4e2e1ba13a918
          EOF
          if gh release view v1.3.7 >/dev/null 2>&1; then
            gh release delete v1.3.7 --yes --cleanup-tag
          fi
          gh release create v1.3.7 escalastop-cpanel.zip --title 'Escalas Top v1.3.7' --notes-file release-notes.md
      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view v1.3.7 --json tagName,name,isDraft,isPrerelease,assets
