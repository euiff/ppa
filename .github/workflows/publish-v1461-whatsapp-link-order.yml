name: Publish Escala de Proposito v1.4.61 WhatsApp Link Order

on:
  push:
    paths:
      - '.github/workflows/publish-v1461-whatsapp-link-order.yml'
      - 'scripts/patch-v1461-whatsapp-link-order.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.60 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.60 -p escala-de-proposito-cpanel.zip --dir base --clobber
          mkdir pkg
          unzip -q base/escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.60"

      - name: Apply WhatsApp link order
        run: |
          set -euo pipefail
          python scripts/patch-v1461-whatsapp-link-order.py

      - name: Validate v1.4.61
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.61"
          php -l pkg/api/volunteer_menu_v1435.php
          grep -Fq '▶️ YouTube:' pkg/api/volunteer_menu_v1435.php
          grep -Fq '🎸 Cifra:' pkg/api/volunteer_menu_v1435.php
          ! grep -Fq '🟢 Spotify:' pkg/api/volunteer_menu_v1435.php
          python - <<'PY'
          from pathlib import Path
          s=Path('pkg/api/volunteer_menu_v1435.php').read_text(encoding='utf-8')
          y=s.index('▶️ YouTube:')
          c=s.index('🎸 Cifra:')
          assert y < c, 'YouTube must appear before Cifra'
          PY
          grep -Fq 'Tom para tocar' pkg/api/volunteer_menu_v1435.php

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip SHA256-v1.4.61.txt
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.61.txt

      - name: Publish v1.4.61
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.61 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.61             escala-de-proposito-cpanel.zip             escalastop-cpanel.zip             SHA256-v1.4.61.txt             --target "$GITHUB_SHA"             --title 'Escala de Propósito v1.4.61'             --notes-file pkg/ATUALIZACAO-v1.4.61.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.61
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.61.txt
          retention-days: 30
