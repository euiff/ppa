name: Publish Escala de Proposito v1.4.4 Print Repertorio

on:
  push:
    paths:
      - '.github/workflows/publish-v144-print-repertorio.yml'
      - 'scripts/patch-v144.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.3 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.3 -p escala-de-proposito-cpanel.zip --clobber
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          mkdir pkg
          unzip -q escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.3"

      - name: Add organized daily print and repertoire
        run: |
          set -euo pipefail
          python3 scripts/patch-v144.py pkg/assets/index-C6Ng0a8i.js
          printf '1.4.4\n' > pkg/VERSION
          cat > pkg/ATUALIZACAO-v1.4.4.md <<'EOF'
          # Escala de Propósito v1.4.4

          - Ao imprimir a escala do dia, gera uma tabela única e organizada com Departamento, Função, Voluntário e Situação.
          - O departamento fica agrupado visualmente, seguindo o modelo de impressão solicitado.
          - Inclui automaticamente o Repertório de músicas no final, com Música, Artista e Tom.
          - Busca o repertório em todas as escalas da mesma igreja, data e culto, para funcionar independentemente do departamento aberto.
          - O botão Baixar PDF gera o mesmo conteúdo em A4.
          - Mantém ensaio e observações quando cadastrados.
          - Mantém todos os recursos da v1.4.3.
          EOF

      - name: Validate v1.4.4
        run: |
          set -euo pipefail
          node --check pkg/assets/index-C6Ng0a8i.js
          test "$(cat pkg/VERSION)" = "1.4.4"
          grep -Fq 'printSongs=async' pkg/assets/index-C6Ng0a8i.js
          grep -Fq 'Repertório de músicas' pkg/assets/index-C6Ng0a8i.js
          grep -Fq 'Departamento","Função","Voluntário","Situação' pkg/assets/index-C6Ng0a8i.js
          grep -Fq 'PDF da escala gerado com o repertório!' pkg/assets/index-C6Ng0a8i.js

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.4.txt

      - name: Publish v1.4.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.4 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.4 \
            escala-de-proposito-cpanel.zip \
            escalastop-cpanel.zip \
            SHA256-v1.4.4.txt \
            --target "$GITHUB_SHA" \
            --title 'Escala de Propósito v1.4.4' \
            --notes-file pkg/ATUALIZACAO-v1.4.4.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.4
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.4.txt
          retention-days: 30
