name: Validate and publish Escalas Top v1.3.10

on:
  push:
    paths:
      - .github/workflows/publish-v1310.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact v1.3.9 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.3.9 -p escalastop-cpanel.zip --clobber
          echo '22485797a5c2292ecc60c1c2b8f6c7efe0361a268b2f757a9a5b4e483e08dbac  escalastop-cpanel.zip' | sha256sum --check --strict
          mkdir pkg
          unzip -q escalastop-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.3.9"

      - name: Apply v1.3.10 confirmation fix
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          api=Path('pkg/api')

          # 1) Corrige o TypeError do quiz: chaves numericas do PHP podem virar int.
          p=api/'quiz_router_v131.php'
          s=p.read_text()
          old="foreach (array_keys($out) as $n) {\n        $local = str_starts_with($n, '55') ? substr($n, 2) : $n;"
          new="foreach (array_keys($out) as $n) {\n        $n = (string)$n;\n        $local = str_starts_with($n, '55') ? substr($n, 2) : $n;"
          if old not in s: raise SystemExit('quiz phone patch anchor missing')
          s=s.replace(old,new,1)
          s=s.replace("return array_keys($out);\n}","return array_map('strval', array_keys($out));\n}",1)
          p.write_text(s)

          # 2) Confirmation router v1.3.10: notificacao exata de escala vence quiz antigo.
          s=(api/'confirmation_router_v139.php').read_text()
          s=s.replace('v139','v1310').replace('V139','V1310').replace('v1.3.9','v1.3.10')
          old="""    // Quiz pós-culto sempre tem prioridade, inclusive quando o item veio do log exato.
              try {
                  $ids=array_map(static fn($p)=>(string)$p['id'],$profiles);
                  if($item&&!empty($item['voluntario_id']))$ids[]=(string)$item['voluntario_id'];
                  $ids=array_values(array_unique(array_filter($ids)));
                  if($ids){$ph=implode(',',array_fill(0,count($ids),'?'));$q=db()->prepare("SELECT id FROM quiz_pos_culto WHERE voluntario_id IN ($ph) AND respondido=0 AND etapa>0 AND updated_at>=DATE_SUB(NOW(),INTERVAL 72 HOUR) LIMIT 1");$q->execute($ids);if($q->fetchColumn()){$GLOBALS['ESCALAS_TOP_V1310_ALLOW_LEGACY']=true;return false;}}
              } catch (Throwable $e) {}
          """
          # Dedenta exatamente o bloco presente no arquivo.
          old=old.replace('              ','    ')
          new="""    // v1.3.10: uma notificacao exata de escala tem prioridade sobre quiz pos-culto.
              // Evita que o mesmo comando 1/2 seja consumido por um quiz antigo.
              if(!$item){
                  try {
                      $ids=array_map(static fn($p)=>(string)$p['id'],$profiles);
                      $ids=array_values(array_unique(array_filter($ids)));
                      if($ids){$ph=implode(',',array_fill(0,count($ids),'?'));$q=db()->prepare("SELECT id FROM quiz_pos_culto WHERE voluntario_id IN ($ph) AND respondido=0 AND etapa>0 AND updated_at>=DATE_SUB(NOW(),INTERVAL 72 HOUR) LIMIT 1");$q->execute($ids);if($q->fetchColumn()){$GLOBALS['ESCALAS_TOP_V1310_ALLOW_QUIZ']=true;return false;}}
                  } catch (Throwable $e) { v1310_trace('quiz_priority_check_error',['type'=>get_class($e),'message'=>substr($e->getMessage(),0,240)]); }
              }
          """.replace('              ','    ')
          if old not in s: raise SystemExit('confirmation quiz-priority block missing')
          s=s.replace(old,new,1)
          (api/'confirmation_router_v1310.php').write_text(s)

          # 3) Webhook v1.3.10: confirmacao antes do quiz e quiz isolado por try/catch.
          s=(api/'webhook-entry-v139.php').read_text()
          s=s.replace('v139e','v1310e').replace('V139','V1310').replace('v139','v1310').replace('v1.3.9','v1.3.10')
          old="""    $GLOBALS['ESCALAS_TOP_WEBHOOK_BODY_V1310']=$body;

              $stage='quiz_router';
              // Mensagem para o próprio número pode vir como fromMe; o quiz legado não deve consumir a confirmação.
              if(!$fromMe&&is_file(__DIR__.'/quiz_router_v131.php')){
                  require_once __DIR__.'/quiz_router_v131.php';
                  if(function_exists('v131_quiz_router_handle')&&v131_quiz_router_handle()){
                      v1310e_trace('handled',['stage'=>'quiz_router']);
                      exit;
                  }
              }

              $stage='confirmation_router_load';
              require_once __DIR__.'/confirmation_router_v1310.php';
              v1310e_trace('phase_ok',['stage'=>$stage,'handler'=>function_exists('v1310_confirmation_router_handle')]);

              $stage='confirmation_router_handle';
              if(function_exists('v1310_confirmation_router_handle')&&v1310_confirmation_router_handle()){
                  v1310e_trace('handled',['stage'=>$stage]);
                  exit;
              }

              if(!empty($GLOBALS['ESCALAS_TOP_V1310_ALLOW_LEGACY'])){
          """.replace('              ','    ')
          new="""    $GLOBALS['ESCALAS_TOP_WEBHOOK_BODY_V1310']=$body;
              $GLOBALS['ESCALAS_TOP_WEBHOOK_BODY_V135']=$body;

              // Primeiro tenta a resposta de escala. Se existir notificacao exata, 1/2 pertence a ela.
              $stage='confirmation_router_load';
              require_once __DIR__.'/confirmation_router_v1310.php';
              v1310e_trace('phase_ok',['stage'=>$stage,'handler'=>function_exists('v1310_confirmation_router_handle')]);

              $stage='confirmation_router_handle';
              if(function_exists('v1310_confirmation_router_handle')&&v1310_confirmation_router_handle()){
                  v1310e_trace('handled',['stage'=>$stage]);
                  exit;
              }

              // O quiz e independente: erro nele nao pode derrubar confirmacao/bridge.
              $stage='quiz_router';
              if(!$fromMe&&is_file(__DIR__.'/quiz_router_v131.php')){
                  try{
                      require_once __DIR__.'/quiz_router_v131.php';
                      if(function_exists('v131_quiz_router_handle')&&v131_quiz_router_handle()){
                          v1310e_trace('handled',['stage'=>'quiz_router']);
                          exit;
                      }
                  }catch(Throwable $quizError){
                      v1310e_trace('module_exception',[
                          'stage'=>'quiz_router','type'=>get_class($quizError),
                          'message'=>substr($quizError->getMessage(),0,300),
                          'file'=>basename($quizError->getFile()),'line'=>$quizError->getLine()
                      ]);
                  }
              }

              if(!empty($GLOBALS['ESCALAS_TOP_V1310_ALLOW_LEGACY'])){
          """.replace('              ','    ')
          if old not in s: raise SystemExit('webhook routing block missing')
          s=s.replace(old,new,1)
          (api/'webhook-entry-v1310.php').write_text(s)

          # 4) Sync Evolution para o novo entry.
          s=(api/'webhook_sync_v139.php').read_text()
          s=s.replace('v139','v1310').replace('V139','V1310').replace('v1.3.9','v1.3.10')
          (api/'webhook_sync_v1310.php').write_text(s)

          # 5) Cron/automacao usa o sync novo.
          p=api/'automation_v130.php'
          s=p.read_text()
          s=s.replace("require_once __DIR__.'/webhook_sync_v139.php';","require_once __DIR__.'/webhook_sync_v1310.php';")
          s=s.replace("'version'=>'1.3.9'","'version'=>'1.3.10'")
          s=s.replace('v139_sync_evolution_webhook()','v1310_sync_evolution_webhook()')
          p.write_text(s)
          PY

          cat > pkg/api/.htaccess <<'EOF'
          # Escalas Top v1.3.10 - confirmation before quiz and isolated modules
          <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteCond %{QUERY_STRING} !(^|&)v1310_legacy=1(&|$) [NC]
          RewriteRule ^webhook(?:\.php)?(?:/messages[-_.]upsert)?/?$ webhook-entry-v1310.php [L,QSA,NC]
          </IfModule>
          EOF
          sed -i 's/^          //' pkg/api/.htaccess
          printf '1.3.10\n' > pkg/VERSION
          cat > pkg/ATUALIZACAO-v1.3.10.md <<'EOF'
          # Escalas Top v1.3.10

          Correção confirmada pelos logs reais da v1.3.9.

          - Corrige `TypeError` em `quiz_router_v131.php` ao normalizar telefones numéricos.
          - A confirmação de escala passa antes do quiz quando existe uma notificação exata recente.
          - O quiz fica isolado: uma falha nele não interrompe o restante do webhook.
          - O payload recebido é compartilhado corretamente com o quiz legado.
          - Evolution é sincronizada automaticamente para `webhook-entry-v1310.php`.
          - Novos logs: `whatsapp-webhook-entry-v1310.log`, `whatsapp-confirmation-v1310.log` e `whatsapp-webhook-sync-v1310.log`.
          EOF
          sed -i 's/^          //' pkg/ATUALIZACAO-v1.3.10.md

      - name: Validate patched files
        run: |
          set -euo pipefail
          cd pkg
          echo '12d7d3a58950a82b486730f0aa71cd5abe5c02495fe9eee270ba66178ce8e953  api/quiz_router_v131.php' | sha256sum --check --strict
          echo '21c2e0704f5f71212806f820eb619a489f35f914388bb2a74fa2037156208d54  api/webhook-entry-v1310.php' | sha256sum --check --strict
          echo '9376846be7667298c0f0e08c1d18b57cd9c9b6bfdab44c79e4a62046a8334ad9  api/confirmation_router_v1310.php' | sha256sum --check --strict
          echo '8c96821a5ce7a4c02761d17138fbcd0bf42b38e3ef133f7cd347e6a3f5064a3e  api/webhook_sync_v1310.php' | sha256sum --check --strict
          echo '848a217f51505cfe4c21df29a7a0c8a96cef87c61b74b415e8fe3351567a9a59  api/automation_v130.php' | sha256sum --check --strict
          test "$(cat VERSION)" = "1.3.10"
          php -l api/quiz_router_v131.php
          php -l api/webhook-entry-v1310.php
          php -l api/confirmation_router_v1310.php
          php -l api/webhook_sync_v1310.php
          php -l api/automation_v130.php
          grep -Fq 'webhook-entry-v1310.php' api/.htaccess
          grep -Fq 'webhook-entry-v1310.php?token=' api/webhook_sync_v1310.php
          grep -Fq "webhook_sync_v1310.php" api/automation_v130.php
          grep -Fq 'v1310_sync_evolution_webhook' api/automation_v130.php

      - name: Run regression test for real v1.3.9 failure
        run: |
          set -euo pipefail
          cd pkg
          cat > test_v1310.php <<'PHP'
          <?php
          declare(strict_types=1);
          define('ESCALAS_TOP_V1310_UNIT_TEST', true);
          require __DIR__.'/api/webhook-entry-v1310.php';
          require __DIR__.'/api/quiz_router_v131.php';
          require __DIR__.'/api/confirmation_router_v1310.php';
          $c=v131_phone_candidates('5564999900599');
          foreach($c as $x) if(!is_string($x)) throw new Exception('quiz candidate not string');
          if(!v131_same_phone('64 99990-0599','5564999900599')) throw new Exception('quiz phone normalization');
          $body=['event'=>'messages.upsert','instance'=>'garra-vips','data'=>['key'=>['remoteJid'=>'5564999900599@s.whatsapp.net','remoteJidAlt'=>'5564999900599@s.whatsapp.net','fromMe'=>false,'id'=>'ABC123'],'message'=>['conversation'=>'1']],'sender'=>'556499994047@s.whatsapp.net','apikey'=>'x'];
          if(v1310e_text($body)!=='1') throw new Exception('entry text');
          $m=v1310_parse_inbound($body);
          foreach($m['identities'] as $id) if(str_contains($id,'4047')) throw new Exception('instance sender leaked');
          if(!v1310_same_phone('64 99990-0599','5564999900599')) throw new Exception('confirmation phone normalization');
          $tr=v1310_transition('pendente',true,time()+3600,time());
          if(($tr['status']??'')!=='confirmado') throw new Exception('transition');
          echo "OK v1.3.10 real-log regression\n";
          PHP
          sed -i 's/^          //' test_v1310.php
          php test_v1310.php
          rm test_v1310.php

      - name: Build package
        run: |
          set -euo pipefail
          (cd pkg && zip -qr ../escalastop-cpanel.zip .)
          unzip -t escalastop-cpanel.zip
          sha256sum escalastop-cpanel.zip | tee SHA256-v1.3.10.txt

      - name: Publish v1.3.10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.3.10 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.3.10 escalastop-cpanel.zip SHA256-v1.3.10.txt \
            --target "$GITHUB_SHA" \
            --title 'Escalas Top v1.3.10' \
            --notes-file pkg/ATUALIZACAO-v1.3.10.md

      - name: Upload validated artifact
        uses: actions/upload-artifact@v4
        with:
          name: escalastop-cpanel-v1.3.10
          path: |
            escalastop-cpanel.zip
            SHA256-v1.3.10.txt
          if-no-files-found: error
          retention-days: 14
