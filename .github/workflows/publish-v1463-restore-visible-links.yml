name: Publish Escala de Proposito v1.4.63 Restore Visible Links

on:
  push:
    paths:
      - '.github/workflows/publish-v1463-restore-visible-links.yml'
      - 'scripts/patch-v1463-restore-visible-links.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.62 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.62 -p escala-de-proposito-cpanel.zip --dir base --clobber
          mkdir pkg
          unzip -q base/escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.62"

      - name: Restore visible repertoire links
        run: |
          set -euo pipefail
          python scripts/patch-v1463-restore-visible-links.py

      - name: Validate v1.4.63
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.63"
          php -l pkg/api/volunteer_menu_v1435.php
          python - <<'PY'
          from pathlib import Path
          s=Path('pkg/api/volunteer_menu_v1435.php').read_text(encoding='utf-8')
          assert '▶️ YouTube: {$yt}' in s
          assert '🎸 Cifra: {$cifra}' in s
          assert 'Tom para tocar' in s
          assert 'Clique aqui no botão abaixo' not in s
          assert 'v1462_send_repertoire' not in s
          assert '/message/sendButtons/' not in s
          assert '🟢 Spotify:' not in s
          assert s.index('▶️ YouTube: {$yt}') < s.index('🎸 Cifra: {$cifra}')
          PY

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip SHA256-v1.4.63.txt
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.63.txt

      - name: Publish v1.4.63
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.63 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.63             escala-de-proposito-cpanel.zip             escalastop-cpanel.zip             SHA256-v1.4.63.txt             --target "$GITHUB_SHA"             --title 'Escala de Propósito v1.4.63'             --notes-file pkg/ATUALIZACAO-v1.4.63.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.63
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.63.txt
          retention-days: 30
