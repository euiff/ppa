name: Publish Escala de Proposito v1.4.79 Skip Past Services

on:
  push:
    paths:
      - '.github/workflows/publish-v1479-skip-past-services.yml'
      - 'scripts/patch-v1479-skip-past-services.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.78 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.78 -p escala-de-proposito-cpanel.zip --dir base --clobber
          echo '81c4be2e905ce98deb88a7ead1e916d5f0a512ccf1eceb0d2c6bd2e285b73cd4  base/escala-de-proposito-cpanel.zip' | sha256sum --check --strict
          mkdir pkg
          unzip -q base/escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.78"

      - name: Apply v1.4.79
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/patch-v1479-skip-past-services.py
          python3 scripts/patch-v1479-skip-past-services.py

      - name: Validate v1.4.79
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.79"
          ASSET=$(find pkg/assets -maxdepth 1 -name 'index-*.js' | head -n 1)
          test -n "$ASSET"

          php -l pkg/api/whatsapp_group_reminder_v1473.php
          php -l pkg/api/automation_v130.php
          node --check pkg/cron-fix-v1478.js
          node --check "$ASSET"

          grep -Fq 'function v1479_scale_already_started' pkg/api/whatsapp_group_reminder_v1473.php
          grep -Fq 'v1479_scale_already_started($scale,$now,$z)' pkg/api/whatsapp_group_reminder_v1473.php
          grep -Fq "'past_skipped'=>0" pkg/api/whatsapp_group_reminder_v1473.php
          grep -Fq 'group_reminders_past_skipped' pkg/api/automation_v130.php
          grep -Fq 'culto(s) passado(s) ignorado(s)' pkg/cron-fix-v1478.js
          grep -Fq '/cron-fix-v1478.js?v=1.4.79' pkg/sistema.html
          grep -Fq '/app-notifications-v1465.js?v=1.4.79' pkg/sistema.html
          grep -Fq '/whatsapp-group-settings-v1473.js?v=1.4.79' pkg/sistema.html
          grep -Fq '/master-whatsapp-groups-entry-v1475.js?v=1.4.79' pkg/sistema.html
          grep -Eq 'src="/assets/index-[^"]+\.js\?v=1\.4\.79"' pkg/sistema.html
          grep -Fq 'escala-version:1.4.79' pkg/sw.js

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip SHA256-v1.4.79.txt
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.79.txt

      - name: Publish v1.4.79
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.79 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.79 \
            escala-de-proposito-cpanel.zip \
            escalastop-cpanel.zip \
            SHA256-v1.4.79.txt \
            --target "$GITHUB_SHA" \
            --title 'Escala de Propósito v1.4.79' \
            --notes-file pkg/ATUALIZACAO-v1.4.79.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.79
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.79.txt
          retention-days: 30
