name: Publish Escala de Proposito v1.4.55 Service Null Lock Metadata

on:
  push:
    paths:
      - '.github/workflows/publish-v1455-service-null-lock-metadata.yml'
      - 'scripts/patch-v1455-service-null-lock-metadata.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.54 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.54 -p escala-de-proposito-cpanel.zip --dir base --clobber
          mkdir pkg
          unzip -q base/escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.54"

      - name: Apply v1.4.55 fixes
        run: |
          set -euo pipefail
          python scripts/patch-v1455-service-null-lock-metadata.py

      - name: Validate v1.4.55
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.55"
          ASSET=$(find pkg/assets -maxdepth 1 -name 'index-*.js' | head -n 1)
          test -n "$ASSET"
          php -l pkg/api/ministerial-hub.php
          node --check "$ASSET"
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('pkg/gestao-ministerial.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/gestao-v1455.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/gestao-v1455.js
          grep -Fq 'unset($s);$scales=array_values(array_filter' pkg/api/ministerial-hub.php
          ! grep -Fq '}$s=null;' pkg/api/ministerial-hub.php
          grep -Fq '(d.departments||[]).filter(Boolean)' pkg/gestao-ministerial.html
          grep -Fq 'Abrir escala completa para editar pessoas' "$ASSET"
          grep -Fq 'Escala completa — editar pessoas' "$ASSET"
          ! grep -Fq 'onClick:it=>{at.light(),xe(ae,it)},"aria-label":"Editar escala"' "$ASSET"
          grep -Fq 'data, horário e nome do culto' pkg/ATUALIZACAO-v1.4.55.md

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip SHA256-v1.4.55.txt
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.55.txt

      - name: Publish v1.4.55
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.55 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.55 \
            escala-de-proposito-cpanel.zip \
            escalastop-cpanel.zip \
            SHA256-v1.4.55.txt \
            --target "$GITHUB_SHA" \
            --title 'Escala de Propósito v1.4.55' \
            --notes-file pkg/ATUALIZACAO-v1.4.55.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.55
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.55.txt
          retention-days: 30
