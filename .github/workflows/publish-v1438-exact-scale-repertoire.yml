name: Publish Escala de Proposito v1.4.38 Exact Scale Repertoire

on:
  push:
    paths:
      - '.github/workflows/publish-v1438-exact-scale-repertoire.yml'
      - 'scripts/patch-v1438-exact-scale-repertoire.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.37 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.37 -p escala-de-proposito-cpanel.zip --dir base --clobber
          mkdir pkg
          unzip -q base/escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.37"

      - name: Fix repertoire source to exact scale
        run: |
          set -euo pipefail
          python scripts/patch-v1438-exact-scale-repertoire.py

      - name: Validate v1.4.38
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.38"
          php -l pkg/api/whatsapp_scale_message_v1421.php >/dev/null
          php -l pkg/api/volunteer_menu_v1435.php >/dev/null
          php -l pkg/api/scale-day-pdf-v1434.php >/dev/null
          grep -Fq "A fonte oficial do repertorio e a MESMA escala aberta no painel" pkg/api/whatsapp_scale_message_v1421.php
          grep -Fq "WHERE BINARY s.escala_id=BINARY ?" pkg/api/whatsapp_scale_message_v1421.php
          grep -Fq "v1421_same_day_repertoire" pkg/api/volunteer_menu_v1435.php
          grep -Fq "v1421_same_day_repertoire" pkg/api/scale-day-pdf-v1434.php
          grep -Fq "m.link_youtube" pkg/api/whatsapp_scale_message_v1421.php
          printf '\n/* exact-scale-repertoire-v1.4.38 */\n' >> pkg/sw.js

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.38.txt

      - name: Publish v1.4.38
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.38 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.38 \
            escala-de-proposito-cpanel.zip \
            escalastop-cpanel.zip \
            SHA256-v1.4.38.txt \
            --target "$GITHUB_SHA" \
            --title 'Escala de Propósito v1.4.38' \
            --notes-file pkg/ATUALIZACAO-v1.4.38.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.38
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.38.txt
          retention-days: 30
