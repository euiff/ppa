name: Publish Escala de Proposito v1.4.47 Organized Scale Page

on:
  push:
    paths:
      - '.github/workflows/publish-v1447-organized-scale-page.yml'
      - 'scripts/patch-v1447-organized-scale-page.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.46 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.46 -p escala-de-proposito-cpanel.zip --dir base --clobber
          mkdir pkg
          unzip -q base/escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.46"

      - name: Organize scale page by service and date
        run: |
          set -euo pipefail
          python scripts/patch-v1447-organized-scale-page.py

      - name: Validate v1.4.47
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.47"
          ASSET=$(find pkg/assets -maxdepth 1 -name 'index-*.js' | head -n 1)
          test -n "$ASSET"
          node --check "$ASSET"
          grep -Fq 'groupScaleCardsV1447' "$ASSET"
          grep -Fq 'renderScaleGroupsV1447' "$ASSET"
          grep -Fq 'Departamentos desta escala' "$ASSET"
          grep -Fq 'Escalas organizadas por culto, data e departamentos' "$ASSET"
          grep -Fq 'Escala de Culto da Família' pkg/ATUALIZACAO-v1.4.47.md

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip SHA256-v1.4.47.txt
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.47.txt

      - name: Publish v1.4.47
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.47 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.47 \
            escala-de-proposito-cpanel.zip \
            escalastop-cpanel.zip \
            SHA256-v1.4.47.txt \
            --target "$GITHUB_SHA" \
            --title 'Escala de Propósito v1.4.47' \
            --notes-file pkg/ATUALIZACAO-v1.4.47.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.47
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.47.txt
          retention-days: 30
