name: Publish Escalas Top v1.3.4

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-v1.3.4.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download validated v1.3.4 package
        run: |
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-9340-820e-8668-dd55fb2eed8d/raw?se=2026-09-02T18%3A07%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=87044a05-952c-5b7a-b25f-b1b5d2d83a89&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T11%3A42%3A01Z&ske=2026-09-03T11%3A42%3A01Z&sks=b&skv=2026-02-06&sig=0buZbZecBj%2B3LUvS/AdH9TsVjo434fdEa0/UTnhq7LI%3D' -o artifact.zip
          unzip -q artifact.zip -d artifact
          test -f artifact/escalastop-cpanel-v1.3.4.zip
          cp artifact/escalastop-cpanel-v1.3.4.zip escalastop-cpanel.zip
          echo 'ca745be03480fa29505329457aba36af91b3eae5d8459c2c5943416060efbe9d  escalastop-cpanel.zip' | sha256sum -c -
          unzip -t escalastop-cpanel.zip
          unzip -p escalastop-cpanel.zip VERSION | grep -qx '1.3.4'
          unzip -l escalastop-cpanel.zip | grep -q 'api/confirmation_router_v134.php'
          unzip -l escalastop-cpanel.zip | grep -q 'database/migrations/202609020003_whatsapp_confirmation_context_v134.sql'
          ! unzip -l escalastop-cpanel.zip | grep -q 'api/config.php'
          ! unzip -l escalastop-cpanel.zip | grep -q 'api/webhook.php'
          ! unzip -l escalastop-cpanel.zip | grep -q 'api/functions.php'

      - name: Publish v1.3.4 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Escalas Top v1.3.4

          - Corrige o webhook de confirmação e recusa de escalas pelo WhatsApp.
          - A resposta 1/2 é ligada à notificação exata da escala, com contexto persistente.
          - Compatibilidade reforçada com Evolution API v2: remoteJid, remoteJidAlt, sender, senderPn, participant, participantPn e @lid.
          - Ignora fromMe, grupos e eventos duplicados.
          - Recupera confirmação válida mesmo se o item foi marcado como faltou antes do início do culto.
          - Respostas repetidas são idempotentes e não alteram outra escala.
          - Quiz pós-culto permanece com prioridade sobre confirmação.
          - O webhook existente é preservado; a integração é feita por roteador seguro com backup automático.
          - Mantém mapa, fuso horário, CRON, quiz, Felicitômetro, PDF, repertório e atualizador.
          EOF
          gh release create v1.3.4 escalastop-cpanel.zip --title "Escalas Top v1.3.4" --notes-file notes.md
