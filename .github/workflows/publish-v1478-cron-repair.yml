name: Publish Escala de Proposito v1.4.78 CRON Repair

on:
  push:
    paths:
      - '.github/workflows/publish-v1478-cron-repair.yml'
      - 'runtime/v1478/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.77 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.77 -p escala-de-proposito-cpanel.zip --dir base --clobber
          echo '5e3f51d552e18c58016439a89a82ac606f0de5b51b339291ea0e21d5ca456ca6  base/escala-de-proposito-cpanel.zip' | sha256sum --check --strict
          mkdir pkg
          unzip -q base/escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.77"

      - name: Add CRON repair and diagnostics
        run: |
          set -euo pipefail
          cp runtime/v1478/api/cron-control-v1478.php pkg/api/
          cp runtime/v1478/cron-fix-v1478.js pkg/

          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('pkg')
          p=root/'sistema.html'
          h=p.read_text(encoding='utf-8')

          h,n=re.subn(r'(<script[^>]+src="/assets/index-[^"?]+\.js)(?:\?[^"]*)?(")',r'\1?v=1.4.78\2',h,count=1)
          if n!=1:
              raise SystemExit('main bundle tag missing')

          replacements=[
              ('/app-notifications-v1465.js?v=1.4.77','/app-notifications-v1465.js?v=1.4.78'),
              ('/whatsapp-group-settings-v1473.js?v=1.4.77','/whatsapp-group-settings-v1473.js?v=1.4.78'),
              ('/master-whatsapp-groups-entry-v1475.js?v=1.4.77','/master-whatsapp-groups-entry-v1475.js?v=1.4.78'),
          ]
          for old,new in replacements:
              h=h.replace(old,new)

          tag='  <script src="/cron-fix-v1478.js?v=1.4.78" defer></script>\n'
          if 'cron-fix-v1478.js' not in h:
              h=h.replace('</body>',tag+'</body>',1)

          p.write_text(h,encoding='utf-8')

          p=root/'sw.js'
          sw=p.read_text(encoding='utf-8')
          sw=re.sub(r'^/\* escala-version:[^*]+\*/\n?','',sw,count=1)
          p.write_text('/* escala-version:1.4.78 */\n'+sw,encoding='utf-8')

          (root/'VERSION').write_text('1.4.78\n',encoding='utf-8')

          (root/'ATUALIZACAO-v1.4.78.md').write_text("""# Escala de Propósito v1.4.78 — Correção do CRON automático

          - Corrige o problema mostrado no MASTER em que o comando do CRON ainda apontava para escala.isaacanthony.com.br.
          - O comando oficial passa a usar https://escaladeproposito.com.br/api/cron-runner.php.
          - O botão Testar CRON agora deixa de depender de uma chamada do navegador ao domínio antigo e passa a executar o motor de automações pelo servidor.
          - Adiciona um painel de diagnóstico com a última execução, último erro e resumo dos lembretes de grupo.
          - Adiciona o botão Corrigir CRON no servidor, que tenta remover a linha antiga e instalar automaticamente o CRON correto a cada minuto.
          - Quando a hospedagem bloquear alteração automática do crontab, o painel continua mostrando a linha correta para copiar no cPanel.
          - A execução manual mostra quantos lembretes de grupo estavam devidos, enviados ou com falha.
          - Mantém todos os recursos e correções da v1.4.77.
          """,encoding='utf-8')
          PY

      - name: Validate v1.4.78
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.78"
          ASSET=$(find pkg/assets -maxdepth 1 -name 'index-*.js' | head -n 1)
          test -n "$ASSET"

          php -l pkg/api/cron-control-v1478.php
          php -l pkg/api/cron-runner.php
          node --check pkg/cron-fix-v1478.js
          node --check "$ASSET"

          grep -Fq "const CR1478_BASE_URL='https://escaladeproposito.com.br';" pkg/api/cron-control-v1478.php
          grep -Fq "Somente o MASTER pode administrar o CRON" pkg/api/cron-control-v1478.php
          grep -Fq "cr1478_install_crontab" pkg/api/cron-control-v1478.php
          grep -Fq "v130_run_all()" pkg/api/cron-control-v1478.php
          grep -Fq "system-cron-config" pkg/cron-fix-v1478.js
          grep -Fq "Corrigir CRON no servidor" pkg/cron-fix-v1478.js
          grep -Fq "Executar automações agora" pkg/cron-fix-v1478.js
          grep -Fq "https://escaladeproposito.com.br" pkg/cron-fix-v1478.js
          grep -Fq '/cron-fix-v1478.js?v=1.4.78' pkg/sistema.html
          grep -Fq '/app-notifications-v1465.js?v=1.4.78' pkg/sistema.html
          grep -Fq '/whatsapp-group-settings-v1473.js?v=1.4.78' pkg/sistema.html
          grep -Fq '/master-whatsapp-groups-entry-v1475.js?v=1.4.78' pkg/sistema.html
          grep -Eq 'src="/assets/index-[^"]+\.js\?v=1\.4\.78"' pkg/sistema.html
          grep -Fq 'escala-version:1.4.78' pkg/sw.js

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip SHA256-v1.4.78.txt
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.78.txt

      - name: Publish v1.4.78
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.78 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.78 \
            escala-de-proposito-cpanel.zip \
            escalastop-cpanel.zip \
            SHA256-v1.4.78.txt \
            --target "$GITHUB_SHA" \
            --title 'Escala de Propósito v1.4.78' \
            --notes-file pkg/ATUALIZACAO-v1.4.78.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.78
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.78.txt
          retention-days: 30
