name: Publish Escala de Proposito v1.4.68 Direct Scale No Plan Toast

on:
  push:
    paths:
      - '.github/workflows/publish-v1468-direct-scale-no-plan-toast.yml'
      - 'scripts/patch-v1468-direct-scale-no-plan-toast.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.67 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.67 -p escala-de-proposito-cpanel.zip --dir base --clobber
          echo 'a3dc7b843f9f92748c7484abead1429070fec7a2c03851b11429e87f8b6ba59a  base/escala-de-proposito-cpanel.zip' | sha256sum --check --strict
          mkdir pkg
          unzip -q base/escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.67"

      - name: Apply v1.4.68
        run: |
          set -euo pipefail
          python scripts/patch-v1468-direct-scale-no-plan-toast.py

      - name: Validate v1.4.68
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.68"
          ASSET=$(find pkg/assets -maxdepth 1 -name 'index-*.js' | head -n 1)
          test -n "$ASSET"
          node --check "$ASSET"
          node --check pkg/plan-feature-guard-v1468.js
          grep -Fq 'window.location.href="/escala/"+encodeURIComponent(ce.id)' "$ASSET"
          grep -Fq 'window.location.href="/escala/"+encodeURIComponent(ae.id)' "$ASSET"
          grep -Fq 'cursor-pointer hover:bg-primary/5' "$ASSET"
          ! grep -Fq 'onClickCapture:it=>{if(it.target.closest("button,a,input,select,textarea,[role=button]"))return;it.preventDefault(),it.stopPropagation(),b(ce.id)' "$ASSET"
          ! grep -Fq 'function addPlanInfo' pkg/plan-feature-guard-v1468.js
          ! grep -Fq 'Comunicação pelo aplicativo' pkg/plan-feature-guard-v1468.js
          grep -Fq 'plan-feature-guard-v1468.js?v=1.4.68' pkg/sistema.html
          grep -Eq 'src="/assets/index-[^"]+\.js\?v=1\.4\.68"' pkg/sistema.html
          grep -Fq 'escala-version:1.4.68' pkg/sw.js

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip SHA256-v1.4.68.txt
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.68.txt

      - name: Publish v1.4.68
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.68 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.68             escala-de-proposito-cpanel.zip             escalastop-cpanel.zip             SHA256-v1.4.68.txt             --target "$GITHUB_SHA"             --title 'Escala de Propósito v1.4.68'             --notes-file pkg/ATUALIZACAO-v1.4.68.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.68
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.68.txt
          retention-days: 30
