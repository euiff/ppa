name: Publish Escala de Proposito v1.4.0 Smart Play

on:
  push:
    paths:
      - '.github/workflows/publish-v1400-smart-play.yml'
      - '.pkg_v1400_bin/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.3.23 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.3.23 -p escala-de-proposito-cpanel.zip --clobber
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          mkdir pkg
          unzip -q escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.3.23"

      - name: Reconstruct and verify v1.4.0 feature delta
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, base64
          p0=''.join(Path('.pkg_v1400_bin/delta-00.b64').read_text().split())
          p1=''.join(Path('.pkg_v1400_bin/delta-01.b64').read_text().split())
          expected0_len=16000
          expected_tail_len=46796
          expected_tail_hash='0617699fc6309630234c20024b40dcc42e6fe4dd42e12e21a9efcae0a716eb8c'
          expected_full_hash='b1e37752a4a7c5af57076169618890dabe10c26942d9db7ce1d23e18c3a13ff8'
          if len(p0) != expected0_len:
              raise SystemExit(f'delta-00 length mismatch: {len(p0)}')
          def h(s): return hashlib.sha256(s.encode()).hexdigest()
          if len(p1) != expected_tail_len or h(p1) != expected_tail_hash:
              extra=len(p1)-expected_tail_len
              fixed=None
              if extra > 0 and extra <= 128:
                  for i in range(len(p1)-extra+1):
                      candidate=p1[:i]+p1[i+extra:]
                      if h(candidate)==expected_tail_hash:
                          print(f'Removed {extra} accidental transport characters at offset {i}')
                          fixed=candidate
                          break
              if fixed is None:
                  raise SystemExit(f'delta-01 transport mismatch len={len(p1)} sha256={h(p1)}')
              p1=fixed
          full=p0+p1
          if len(full)!=62796 or h(full)!=expected_full_hash:
              raise SystemExit(f'full delta mismatch len={len(full)} sha256={h(full)}')
          raw=base64.b64decode(full, validate=True)
          if hashlib.sha256(raw).hexdigest()!='6ff1771eef056ac298a09c82eca0c2d5136bfb640ad64e6538b5b8ba3301cca5':
              raise SystemExit('decoded delta SHA256 mismatch')
          Path('delta.tar.gz').write_bytes(raw)
          print('Delta verified:', len(raw), 'bytes')
          PY
          gzip -t delta.tar.gz
          tar -xzf delta.tar.gz -C pkg
          test "$(cat pkg/VERSION)" = "1.4.0"

      - name: Validate smart features and Play safeguards
        run: |
          set -euo pipefail
          php -l pkg/api/sos_lib_v140.php
          php -l pkg/api/sos.php
          php -l pkg/api/sos-router-v140.php
          php -l pkg/api/scale-health.php
          php -l pkg/api/app_notifications_v140.php
          php -l pkg/api/app-notifications.php
          php -l pkg/api/church-admin.php
          php -l pkg/api/account-delete.php
          php -l pkg/api/billing-checkout.php
          php -l pkg/api/confirmation_router_v1311.php
          php -l pkg/api/pending_router_v1311.php
          php -l pkg/api/webhook-entry-v1311.php
          node --check pkg/smart-features.js
          node --check pkg/app-native-sync.js
          node --check pkg/subscription-guard.js
          grep -Fq 'Saúde da Escala' pkg/smart-features.js
          grep -Fq 'SOS Escala' pkg/smart-features.js
          grep -Fq 'Somente o administrador principal' pkg/api/church-admin.php
          grep -Fq 'play_consumption_only' pkg/api/billing-checkout.php
          grep -Fq 'EscalaPlay/1' pkg/planos.html
          grep -Fq '/api/app-notifications.php?action=pull' pkg/app-native-sync.js
          grep -Fq 'etapa=3,respondido=0' pkg/api/quiz_router_v131.php
          test -f pkg/administracao-igreja.html
          test -f pkg/notificacoes.html
          test -f pkg/sos.html
          test -f pkg/sobre-app.html

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.0.txt

      - name: Publish v1.4.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.0 \
            escala-de-proposito-cpanel.zip \
            escalastop-cpanel.zip \
            SHA256-v1.4.0.txt \
            --target "$GITHUB_SHA" \
            --title 'Escala de Propósito v1.4.0' \
            --notes-file pkg/ATUALIZACAO-v1.4.0.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.0
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.0.txt
          retention-days: 30
