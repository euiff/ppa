name: Publish Escala de Proposito v1.4.45 Global Order Secretary

on:
  push:
    paths:
      - '.github/workflows/publish-v1445-global-order-secretary.yml'
      - 'scripts/patch-v1445-global-order-secretary.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.44 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.44 -p escala-de-proposito-cpanel.zip --dir base --clobber
          mkdir pkg
          unzip -q base/escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.44"

      - name: Apply global ordering and secretary role
        run: |
          set -euo pipefail
          python scripts/patch-v1445-global-order-secretary.py

      - name: Validate v1.4.45
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.45"
          ASSET=$(find pkg/assets -maxdepth 1 -name 'index-*.js' | head -n 1)
          test -n "$ASSET"
          node --check "$ASSET"
          php -l pkg/api/scale-day-pdf-v1434.php
          php -l pkg/api/scale-day-pdf-v1435.php
          php -l pkg/api/volunteer_menu_v1435.php
          grep -Fq 'secretaria:"Secretária"' "$ASSET"
          grep -Fq 'value:"secretaria",children:"Secretária"' "$ASSET"
          grep -Fq 'itens:[...(pe.itens||[])].sort' "$ASSET"
          grep -Fq "role='secretaria'" pkg/api/volunteer_menu_v1435.php
          grep -Fq 'v1445_church_days' pkg/api/volunteer_menu_v1435.php
          grep -Fq 'v1445_selected_scale' pkg/api/volunteer_menu_v1435.php
          grep -Fq 'strnatcasecmp' pkg/api/scale-day-pdf-v1434.php
          grep -Fq 'strnatcasecmp' pkg/api/scale-day-pdf-v1435.php
          grep -Fq 'Cria o novo cargo **Secretária**' pkg/ATUALIZACAO-v1.4.45.md

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip SHA256-v1.4.45.txt
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.45.txt

      - name: Publish v1.4.45
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.45 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.45 \
            escala-de-proposito-cpanel.zip \
            escalastop-cpanel.zip \
            SHA256-v1.4.45.txt \
            --target "$GITHUB_SHA" \
            --title 'Escala de Propósito v1.4.45' \
            --notes-file pkg/ATUALIZACAO-v1.4.45.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.45
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.45.txt
          retention-days: 30
