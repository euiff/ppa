name: Validate and publish Escalas Top v1.3.9

on:
  push:
    paths:
      - .github/workflows/publish-v139.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PACKAGE_BLOBS: 6836e3045b858a30c2b6918f4b966e67fbac2232 b7d934407bd19e7ef2bf88798f407e7a57865517 269c8ab77155d8616b25b963aeeb891f0c9fe713 28cbee68eb1501849614a557a492db20143ed4f3 3810f9948efcd8c60e818ee6aa5e03af83f378b1 ac9438717709e6dfe73a9ef154b50a037281181b
  BASE_SHA256: 70adb502436b2556db7fc51dd6f5dcc5e11d38faf6713eb2897fa3c1dc4b5857

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher sources
        uses: actions/checkout@v4

      - name: Reconstruct exact v1.3.8 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > package.b64
          for blob in ${PACKAGE_BLOBS}; do
            gh api "/repos/${GITHUB_REPOSITORY}/git/blobs/${blob}" --jq .content \
              | tr -d '\n' | base64 --decode >> package.b64
          done
          base64 --decode package.b64 > escalastop-cpanel-v1.3.8.zip
          echo "${BASE_SHA256}  escalastop-cpanel-v1.3.8.zip" | sha256sum --check --strict
          mkdir escalastop-v1.3.9
          unzip -q escalastop-cpanel-v1.3.8.zip -d escalastop-v1.3.9
          test "$(cat escalastop-v1.3.9/VERSION)" = "1.3.8"

      - name: Overlay v1.3.9 WhatsApp confirmation fix
        run: |
          set -euo pipefail
          decode_payload() {
            src="$1"
            dst="$2"
            base64 --decode "$src" | gzip -dc > "$dst"
          }
          decode_payload .pkg_v139_src/webhook-entry-v139.php.gz.b64 escalastop-v1.3.9/api/webhook-entry-v139.php
          decode_payload .pkg_v139_src/confirmation_router_v139.php.gz.b64 escalastop-v1.3.9/api/confirmation_router_v139.php
          decode_payload .pkg_v139_src/webhook_sync_v139.php.gz.b64 escalastop-v1.3.9/api/webhook_sync_v139.php
          decode_payload .pkg_v139_src/automation_v130.php.gz.b64 escalastop-v1.3.9/api/automation_v130.php

          cat > escalastop-v1.3.9/api/.htaccess <<'EOF'
          # Escalas Top v1.3.9 - reliable WhatsApp webhook entry
          <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteCond %{QUERY_STRING} !(^|&)v139_legacy=1(&|$) [NC]
          RewriteRule ^webhook(?:\.php)?(?:/messages[-_.]upsert)?/?$ webhook-entry-v139.php [L,QSA,NC]
          </IfModule>
          EOF
          sed -i 's/^          //' escalastop-v1.3.9/api/.htaccess

          printf '1.3.9\n' > escalastop-v1.3.9/VERSION
          cat > escalastop-v1.3.9/ATUALIZACAO-v1.3.9.md <<'EOF'
          # Escalas Top v1.3.9

          Correção do fluxo de confirmação de escala pelo WhatsApp.

          - Separa o número do contato (`data.key.remoteJid` / `remoteJidAlt`) do número da instância Evolution (`sender`).
          - Mantém compatibilidade com LID/PN e variações brasileiras com/sem nono dígito.
          - Adiciona rastreamento por fase no webhook para impedir falhas silenciosas.
          - Registra resolução da escala e resultado do envio da resposta.
          - Quando a resposta não puder ser associada a uma escala, envia aviso explícito em vez de ficar em silêncio.
          - Sincroniza automaticamente a Evolution para `webhook-entry-v139.php`.
          EOF
          sed -i 's/^          //' escalastop-v1.3.9/ATUALIZACAO-v1.3.9.md

      - name: Validate exact patch payloads and PHP syntax
        run: |
          set -euo pipefail
          cd escalastop-v1.3.9
          echo '4df1033b6aed11cf10b882b7e2566f1a2ff117e1a9624bc6223e0dbc930da0f3  api/webhook-entry-v139.php' | sha256sum --check --strict
          echo 'f1a068c9e0e3b0d91e1d9efba07f9dfb622f991053b5baf3e63cc373f034ddb3  api/confirmation_router_v139.php' | sha256sum --check --strict
          echo '4a939f3b7741c6191ad0e79e8bf37d2e7ba521c676830af116789bd68a9045b8  api/webhook_sync_v139.php' | sha256sum --check --strict
          echo '9e97bab69d2d996e23a1698e40fc13c9488c58dd5ae949a6450f7ff65892fac6  api/automation_v130.php' | sha256sum --check --strict
          test "$(cat VERSION)" = "1.3.9"
          test -f index.html
          test -f api/confirmation_router_v138.php
          test -f api/webhook-entry-v138.php
          test -f api/webhook-entry-v139.php
          test -f api/confirmation_router_v139.php
          test -f api/webhook_sync_v139.php
          php -l api/webhook-entry-v139.php
          php -l api/confirmation_router_v139.php
          php -l api/webhook_sync_v139.php
          php -l api/automation_v130.php
          grep -Fq 'webhook-entry-v139.php' api/.htaccess
          grep -Fq 'webhook-entry-v139.php?token=' api/webhook_sync_v139.php
          grep -Fq "webhook_sync_v139.php" api/automation_v130.php
          grep -Fq 'v139_sync_evolution_webhook' api/automation_v130.php

      - name: Run identity regression test
        run: |
          set -euo pipefail
          cd escalastop-v1.3.9
          cat > test_parser_v139.php <<'PHP'
          <?php
          define('ESCALAS_TOP_V139_UNIT_TEST', true);
          require __DIR__.'/api/webhook-entry-v139.php';
          require __DIR__.'/api/confirmation_router_v139.php';
          $body=[
            'event'=>'messages.upsert',
            'instance'=>'teste',
            'data'=>[
              'key'=>[
                'remoteJid'=>'5564999900599@s.whatsapp.net',
                'remoteJidAlt'=>'5564999900599@s.whatsapp.net',
                'fromMe'=>false,
                'id'=>'ABC123'
              ],
              'message'=>['conversation'=>'1']
            ],
            'sender'=>'556499994047@s.whatsapp.net',
            'apikey'=>'x'
          ];
          $m=v139_parse_inbound($body);
          if(($m['text']??'')!=='1') throw new Exception('text');
          if(count($m['identities'])<1) throw new Exception('no identity');
          foreach($m['identities'] as $id) if(str_contains($id,'4047')) throw new Exception('instance sender leaked into volunteer identities');
          if(!str_contains(implode('|',$m['identities']),'0599')) throw new Exception('remoteJid missing');
          if(($m['instance_sender_label']??'')!=='phone:4047') throw new Exception('instance sender label');
          if(!v139_same_phone('64 99990-0599','5564999900599')) throw new Exception('phone normalization');
          $tr=v139_transition('pendente',true,time()+3600,time());
          if(($tr['status']??'')!=='confirmado') throw new Exception('transition');
          echo "OK v1.3.9 parser/identity/transition\n";
          PHP
          sed -i 's/^          //' test_parser_v139.php
          php test_parser_v139.php
          rm test_parser_v139.php

      - name: Build update package
        run: |
          set -euo pipefail
          (cd escalastop-v1.3.9 && zip -qr ../escalastop-cpanel.zip .)
          unzip -t escalastop-cpanel.zip
          sha256sum escalastop-cpanel.zip | tee SHA256-v1.3.9.txt

      - name: Publish v1.3.9 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.3.9 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.3.9 escalastop-cpanel.zip SHA256-v1.3.9.txt \
            --target "$GITHUB_SHA" \
            --title 'Escalas Top v1.3.9' \
            --notes-file escalastop-v1.3.9/ATUALIZACAO-v1.3.9.md

      - name: Upload validated package artifact
        uses: actions/upload-artifact@v4
        with:
          name: escalastop-cpanel-v1.3.9
          path: |
            escalastop-cpanel.zip
            SHA256-v1.3.9.txt
          if-no-files-found: error
          retention-days: 14
