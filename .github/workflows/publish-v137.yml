name: Validate and publish Escalas Top v1.3.7

on:
  push:
    paths:
      - .github/workflows/publish-v137.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Recover exact package blob
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_BLOB: 30c5642fb5e9dddee6aa8b89218f3d8626a76b7f
          PACKAGE_SHA256: 24f2a029932918c6438df81742afd51ebfd922d5ddef37203db5ce27a1437507
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/git/blobs/${PACKAGE_BLOB}" --jq .content \
            | tr -d '\n' | base64 --decode > escalastop-cpanel-v1.3.7.zip
          echo "${PACKAGE_SHA256}  escalastop-cpanel-v1.3.7.zip" | sha256sum --check --strict
          unzip -t escalastop-cpanel-v1.3.7.zip
          mkdir escalastop-v1.3.7
          unzip -q escalastop-cpanel-v1.3.7.zip -d escalastop-v1.3.7

      - name: Validate package structure and PHP syntax
        run: |
          test "$(cat escalastop-v1.3.7/VERSION)" = "1.3.7"
          test -f escalastop-v1.3.7/index.html
          test -f escalastop-v1.3.7/api/confirmation_router_v137.php
          test -f escalastop-v1.3.7/api/webhook-entry-v137.php
          test -f escalastop-v1.3.7/api/webhook_sync_v137.php
          find escalastop-v1.3.7/api -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          grep -Fq 'webhook-entry-v137.php' escalastop-v1.3.7/api/.htaccess
          grep -Fq "['MESSAGES_UPSERT','MESSAGES_UPDATE']" escalastop-v1.3.7/api/webhook_sync_v137.php
          grep -Fq "webhookByEvents'=>false" escalastop-v1.3.7/api/webhook_sync_v137.php
          grep -Fq "v137_sync_evolution_webhook" escalastop-v1.3.7/api/automation_v130.php

      - name: Run webhook regression tests
        env:
          WEBHOOK_TEST_B64: 
        run: |
          printf '%s' "${WEBHOOK_TEST_B64}" | base64 --decode > webhook-v137-test.php
          php webhook-v137-test.php

      - name: Publish official release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_SHA256: 24f2a029932918c6438df81742afd51ebfd922d5ddef37203db5ce27a1437507
        run: |
          if gh release view v1.3.7 >/dev/null 2>&1; then
            echo 'Release v1.3.7 already exists' >&2
            exit 1
          fi
          cp escalastop-cpanel-v1.3.7.zip escalastop-cpanel.zip
          printf '%s\n' \
            'Escalas Top v1.3.7' \
            '' \
            '- Corrige o caso em que a notificação chega, mas a resposta 1/2 não recebe retorno.' \
            '- Registra e repara automaticamente o webhook da Evolution para MESSAGES_UPSERT.' \
            '- Usa uma entrada direta que não depende de mod_rewrite/AllowOverride do cPanel.' \
            '- Aceita o token da URL e, com segurança, a apikey/instância do payload oficial quando um proxy remove a query string.' \
            '- Reconhece payloads aninhados e variações de evento da Evolution sem cruzar respostas entre voluntários.' \
            '- Mantém quiz, trocas, justificativas, mapa, CRON e os demais recursos existentes.' \
            '- Pacote aprovado por lint PHP, testes de regressão do webhook e verificação de integridade do ZIP.' \
            '' \
            "SHA-256: ${PACKAGE_SHA256}" > release-notes.md
          gh release create v1.3.7 escalastop-cpanel.zip \
            --title 'Escalas Top v1.3.7' \
            --notes-file release-notes.md
