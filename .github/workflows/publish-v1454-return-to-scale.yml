name: Publish Escala de Proposito v1.4.54 Return To Scale

on:
  push:
    paths:
      - '.github/workflows/publish-v1454-return-to-scale.yml'
      - 'scripts/patch-v1454-return-to-scale.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.53 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.53 -p escala-de-proposito-cpanel.zip --dir base --clobber
          mkdir pkg
          unzip -q base/escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.53"

      - name: Apply v1.4.54 restore action
        run: |
          set -euo pipefail
          python scripts/patch-v1454-return-to-scale.py

      - name: Validate v1.4.54
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.54"
          ASSET=$(find pkg/assets -maxdepth 1 -name 'index-*.js' | head -n 1)
          test -n "$ASSET"
          node --check "$ASSET"
          grep -Fq 'Voltar para escala' "$ASSET"
          grep -Fq 'restoreRefused=async ce=>' "$ASSET"
          grep -Fq 'p_new_status:"pendente"' "$ASSET"
          grep -Fq 'justificativa_recusa:null' "$ASSET"
          grep -Fq 'from("trocas").update({status:"recusado"})' "$ASSET"
          grep -Fq 'from("indisponibilidades").delete()' "$ASSET"
          grep -Fq 'force_resend:!0' "$ASSET"
          grep -Fq 'Substituir' "$ASSET"
          grep -Fq 'histórico/auditoria' pkg/ATUALIZACAO-v1.4.54.md

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip SHA256-v1.4.54.txt
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.54.txt

      - name: Publish v1.4.54
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.54 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.54 \
            escala-de-proposito-cpanel.zip \
            escalastop-cpanel.zip \
            SHA256-v1.4.54.txt \
            --target "$GITHUB_SHA" \
            --title 'Escala de Propósito v1.4.54' \
            --notes-file pkg/ATUALIZACAO-v1.4.54.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.54
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.54.txt
          retention-days: 30
