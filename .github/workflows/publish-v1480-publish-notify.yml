name: Publish Escala de Proposito v1.4.80 Notify on Publish Only

on:
  push:
    paths:
      - '.github/workflows/publish-v1480-publish-notify.yml'
      - 'scripts/patch-v1480-publish-notify.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.79 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.79 -p escala-de-proposito-cpanel.zip --dir base --clobber
          echo 'fe0c08235a11ce9a0d202da8eef044018d603867fc6b7606afa8d1330cbe7c46  base/escala-de-proposito-cpanel.zip' | sha256sum --check --strict
          mkdir pkg
          unzip -q base/escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.79"

      - name: Apply notification publication gate
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/patch-v1480-publish-notify.py
          python3 scripts/patch-v1480-publish-notify.py

      - name: Validate v1.4.80
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.80"
          ASSET=$(find pkg/assets -maxdepth 1 -name 'index-*.js' | head -n 1)
          test -n "$ASSET"

          node --check "$ASSET"
          php -l pkg/api/app-pending.php
          php -l pkg/api/app-scale-resend-v1470.php
          php -l pkg/api/app_notification_events_v1470.php

          grep -Fq '.eq("escalas.status","publicado")' "$ASSET"
          grep -Fq 'if(S)return;x.push(' "$ASSET"
          grep -Fq 'sendChannelV1470=async pe=>' "$ASSET"
          grep -Fq 'resultsV1480.app_queued' "$ASSET"
          grep -Fq 'V.warning("Voluntário salvo. Clique em Reenviar Notificações' "$ASSET"
          grep -Fq "AND e.status='publicado'" pkg/api/app-pending.php
          grep -Fq "e.status='publicado'" pkg/api/app_notification_events_v1470.php
          grep -Fq 'Primeiro publique a escala para enviar notificações' pkg/api/app-scale-resend-v1470.php
          grep -Fq 'escala-version:1.4.80' pkg/sw.js
          grep -Eq 'src="/assets/index-[^"]+\.js\?v=1\.4\.80"' pkg/sistema.html

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip SHA256-v1.4.80.txt
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.80.txt

      - name: Publish v1.4.80
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.80 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.80 \
            escala-de-proposito-cpanel.zip \
            escalastop-cpanel.zip \
            SHA256-v1.4.80.txt \
            --target "$GITHUB_SHA" \
            --title 'Escala de Propósito v1.4.80' \
            --notes-file pkg/ATUALIZACAO-v1.4.80.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.80
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.80.txt
          retention-days: 30
