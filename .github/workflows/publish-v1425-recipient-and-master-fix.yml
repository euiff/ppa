name: Publish Escala de Proposito v1.4.25 Recipient and Master Fix

on:
  push:
    paths:
      - '.github/workflows/publish-v1425-recipient-and-master-fix.yml'
      - 'scripts/patch-v1425-recipient-and-master-fix.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.24 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.24 -p escala-de-proposito-cpanel.zip --clobber
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          mkdir pkg
          unzip -q escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.24"

      - name: Apply fixes
        run: |
          set -euo pipefail
          python3 scripts/patch-v1425-recipient-and-master-fix.py pkg
          printf '1.4.25\n' > pkg/VERSION
          cat > pkg/ATUALIZACAO-v1.4.25.md <<'EOF'
          # Escala de Propósito v1.4.25

          - Corrige o HTTP 400 de `/api/church-admin.php` quando o usuário é MASTER sem igreja vinculada.
          - Identifica `exists:false` da Evolution API como número não encontrado/registrado no WhatsApp.
          - Não repete automaticamente envio para o mesmo número que a Evolution informou como inexistente.
          - Se o WhatsApp do voluntário for corrigido no cadastro, o sistema volta a permitir o envio pendente.
          - A central de logs mostra uma mensagem legível para conferir o número cadastrado.
          - Mantém transporte `{number, text}`, repertório, link de confirmação, respostas 1/2, quiz de uma pergunta e aviso ao pastor/líder.
          EOF

      - name: Validate v1.4.25
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/patch-v1425-recipient-and-master-fix.py
          for f in pkg/api/church-admin.php pkg/api/whatsapp_transport_v1424.php pkg/api/automation_v130.php pkg/api/master-system-logs.php; do php -l "$f" >/dev/null; done
          test "$(cat pkg/VERSION)" = "1.4.25"
          grep -Fq 'master_without_church' pkg/api/church-admin.php
          grep -Fq 'recipient_not_on_whatsapp' pkg/api/whatsapp_transport_v1424.php
          grep -Fq 'non_retryable' pkg/api/automation_v130.php
          grep -Fq 'WhatsApp do destinatário não encontrado' pkg/api/master-system-logs.php
          grep -Fq "transport_version']='1.4.25" pkg/api/whatsapp_transport_v1424.php
          grep -Fq 'master-church-admin-and-whatsapp-recipient-v1.4.25' pkg/sw.js

      - name: Test Evolution exists false
        run: |
          set -euo pipefail
          php -r 'function config_value($k,$i=null,$d=""){return ["evolution_url"=>"https://fake.invalid","evolution_api_key"=>"fake","evolution_instance"=>"teste"][$k]??$d;} function http_json($u,$m,$p,$h){return ["ok"=>false,"status"=>400,"body"=>["status"=>400,"error"=>"Bad Request","response"=>["message"=>[["jid"=>"556493012809@s.whatsapp.net","exists"=>false,"number"=>"5564993012809"]]]],"raw"=>"","error"=>null];} require "pkg/api/whatsapp_transport_v1424.php"; $r=v1424_evolution_send("(64) 99301-2809","Teste",null); if(($r["error_code"]??"")!=="recipient_not_on_whatsapp"||empty($r["non_retryable"])) exit(1);'

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.25.txt

      - name: Publish v1.4.25
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.25 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.25 \
            escala-de-proposito-cpanel.zip \
            escalastop-cpanel.zip \
            SHA256-v1.4.25.txt \
            --target "$GITHUB_SHA" \
            --title 'Escala de Propósito v1.4.25' \
            --notes-file pkg/ATUALIZACAO-v1.4.25.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.25
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.25.txt
          retention-days: 30
