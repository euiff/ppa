name: Publish Escala de Proposito v1.4.77 WhatsApp Text

on:
  push:
    paths:
      - '.github/workflows/publish-v1477-whatsapp-text.yml'
      - 'scripts/patch-v1477-whatsapp-text.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.76 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.76 -p escala-de-proposito-cpanel.zip --dir base --clobber
          echo 'c3d55e70469d4e55e16f96107527dd707e9b2b111359d6fb96fbb7364c31d077  base/escala-de-proposito-cpanel.zip' | sha256sum --check --strict
          mkdir pkg
          unzip -q base/escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.76"

      - name: Apply v1.4.77
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/patch-v1477-whatsapp-text.py
          python3 scripts/patch-v1477-whatsapp-text.py

      - name: Validate v1.4.77
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.77"
          ASSET=$(find pkg/assets -maxdepth 1 -name 'index-*.js' | head -n 1)
          test -n "$ASSET"

          php -l pkg/api/whatsapp_group_reminder_v1473.php
          node --check pkg/whatsapp-group-settings-v1473.js
          node --check pkg/master-whatsapp-groups-entry-v1475.js
          node --check "$ASSET"

          grep -Fq 'Por gentileza, entrem no WhatsApp do sistema Escala de Propósito e façam a confirmação das pendências.' pkg/api/whatsapp_group_reminder_v1473.php
          grep -Fq "str_replace(" pkg/api/whatsapp_group_reminder_v1473.php
          grep -Fq '/whatsapp-group-settings-v1473.js?v=1.4.77' pkg/sistema.html
          grep -Fq '/app-notifications-v1465.js?v=1.4.77' pkg/sistema.html
          grep -Fq '/master-whatsapp-groups-entry-v1475.js?v=1.4.77' pkg/sistema.html
          grep -Eq 'src="/assets/index-[^"]+\.js\?v=1\.4\.77"' pkg/sistema.html
          grep -Fq 'escala-version:1.4.77' pkg/sw.js

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip SHA256-v1.4.77.txt
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.77.txt

      - name: Publish v1.4.77
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.77 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.77 \
            escala-de-proposito-cpanel.zip \
            escalastop-cpanel.zip \
            SHA256-v1.4.77.txt \
            --target "$GITHUB_SHA" \
            --title 'Escala de Propósito v1.4.77' \
            --notes-file pkg/ATUALIZACAO-v1.4.77.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.77
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.77.txt
          retention-days: 30
