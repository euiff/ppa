name: Publish Escala de Proposito v1.4.59 Leader Remove Person

on:
  push:
    paths:
      - '.github/workflows/publish-v1459-leader-remove-person.yml'
      - 'scripts/patch-v1459-leader-remove-person.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.58 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.58 -p escala-de-proposito-cpanel.zip --dir base --clobber
          mkdir pkg
          unzip -q base/escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.58"

      - name: Apply leader remove permission
        run: |
          set -euo pipefail
          python scripts/patch-v1459-leader-remove-person.py

      - name: Validate v1.4.59
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.59"
          ASSET=$(find pkg/assets -maxdepth 1 -name 'index-*.js' | head -n 1)
          test -n "$ASSET"
          node --check "$ASSET"
          grep -Fq 'leaderOwnDepartmentV1459' "$ASSET"
          grep -Fq 'canRemovePeopleV1459=!ze&&(we||leaderOwnDepartmentV1459)' "$ASSET"
          grep -Fq 'Remover esta pessoa da escala' "$ASSET"
          grep -Fq 'Isso remove a pessoa somente desta escala.' "$ASSET"
          grep -Fq 'Você não tem permissão para remover pessoas desta escala' "$ASSET"
          grep -Fq 'Líder pode remover pessoas da própria escala' pkg/ATUALIZACAO-v1.4.59.md

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip SHA256-v1.4.59.txt
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.59.txt

      - name: Publish v1.4.59
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.59 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.59 \
            escala-de-proposito-cpanel.zip \
            escalastop-cpanel.zip \
            SHA256-v1.4.59.txt \
            --target "$GITHUB_SHA" \
            --title 'Escala de Propósito v1.4.59' \
            --notes-file pkg/ATUALIZACAO-v1.4.59.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.59
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.59.txt
          retention-days: 30
