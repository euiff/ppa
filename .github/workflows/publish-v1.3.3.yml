name: Publish Escalas Top v1.3.3

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-v1.3.3.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download validated v1.3.3 package
        run: |
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-81f8-820e-83d2-a232ac070b9e/raw?se=2026-09-02T15%3A31%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=bc00475b-d10b-5b38-8167-3475868bacf9&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T11%3A07%3A08Z&ske=2026-09-03T11%3A07%3A08Z&sks=b&skv=2026-02-06&sig=UFjdbD26ad3Z5GuohypI/0u%2B0oar3fH3mibS5iassZk%3D' -o artifact.zip
          unzip -q artifact.zip -d artifact
          test -f artifact/escalastop-cpanel-v1.3.3.zip
          cp artifact/escalastop-cpanel-v1.3.3.zip escalastop-cpanel.zip
          echo '2aaa5b591a15808dc523f4860a0c7eff96a1878595948bab8b6235d100b273d5  escalastop-cpanel.zip' | sha256sum -c -
          unzip -t escalastop-cpanel.zip
          unzip -p escalastop-cpanel.zip VERSION | grep -qx '1.3.3'
          unzip -l escalastop-cpanel.zip | grep -q 'api/timezone_v133.php'
          unzip -l escalastop-cpanel.zip | grep -q 'api/timezone-status.php'
          unzip -l escalastop-cpanel.zip | grep -q 'database/migrations/202609020002_church_timezone_v133.sql'
          ! unzip -l escalastop-cpanel.zip | grep -q 'api/config.php'
          ! unzip -l escalastop-cpanel.zip | grep -q 'api/webhook.php'
          ! unzip -l escalastop-cpanel.zip | grep -q 'api/functions.php'

      - name: Publish v1.3.3 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Escalas Top v1.3.3

          - Adiciona campo de endereço completo em Configurações da Igreja.
          - Localiza o endereço e mostra a igreja em mapa interativo OpenStreetMap.
          - Permite clicar no mapa para ajustar o ponto exato e salvar latitude/longitude.
          - Mostra no mapa o raio permitido para check-in.
          - Adiciona fuso horário configurável por igreja e fuso global para o MASTER.
          - Brasília / São Paulo (America/Sao_Paulo, UTC-3) é o padrão recomendado.
          - PHP e conexão MySQL passam a utilizar o fuso configurado.
          - CRON calcula horários de escalas, faltas e quiz com o fuso correto da igreja.
          - A tela mostra a hora atual do servidor e o offset UTC para conferência.
          - O bootstrap é integrado com backup automático e não substitui config.php nem webhook.php.
          - Mantém todas as correções anteriores de WhatsApp, quiz, Felicitômetro, check-in, PDF, repertório e atualizador.
          EOF
          gh release create v1.3.3 escalastop-cpanel.zip --title "Escalas Top v1.3.3" --notes-file notes.md
