name: Publish Escala de Proposito v1.4.49 Balance Legacy Print

on:
  push:
    paths:
      - '.github/workflows/publish-v1449-balance-legacy-print.yml'
      - 'scripts/patch-v1449-balance-legacy-print.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.48 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.48 -p escala-de-proposito-cpanel.zip --dir base --clobber
          mkdir pkg
          unzip -q base/escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.48"
          find pkg/assets -maxdepth 1 -name 'index-*.js' -print0 | sort -z | xargs -0 sha256sum > /tmp/assets-before.sha

      - name: Apply v1.4.49 fix
        run: |
          set -euo pipefail
          python scripts/patch-v1449-balance-legacy-print.py

      - name: Validate v1.4.49
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.49"
          php -l pkg/api/ministerial-hub.php
          grep -Fq "unset(\$r)" pkg/api/ministerial-hub.php
          grep -Fq "function balancePeople(d)" pkg/gestao-ministerial.html
          grep -Fq "Imprimir / PDF — modelo clássico" pkg/gestao-ministerial.html
          grep -Fq "top.location.href='/escala/'+encodeURIComponent(b.id)" pkg/gestao-ministerial.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('pkg/gestao-ministerial.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not scripts:
              raise SystemExit('script not found')
          Path('/tmp/gestao-v1449.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/gestao-v1449.js
          find pkg/assets -maxdepth 1 -name 'index-*.js' -print0 | sort -z | xargs -0 sha256sum > /tmp/assets-after.sha
          diff -u /tmp/assets-before.sha /tmp/assets-after.sha
          grep -Fq 'A4 retrato' pkg/ATUALIZACAO-v1.4.49.md
          grep -Fq 'Baixar PDF' pkg/ATUALIZACAO-v1.4.49.md

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip SHA256-v1.4.49.txt
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.49.txt

      - name: Publish v1.4.49
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.49 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.49 \
            escala-de-proposito-cpanel.zip \
            escalastop-cpanel.zip \
            SHA256-v1.4.49.txt \
            --target "$GITHUB_SHA" \
            --title 'Escala de Propósito v1.4.49' \
            --notes-file pkg/ATUALIZACAO-v1.4.49.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.49
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.49.txt
          retention-days: 30
