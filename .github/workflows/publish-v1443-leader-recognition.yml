name: Publish Escala de Proposito v1.4.43 Leader Recognition

on:
  push:
    paths:
      - '.github/workflows/publish-v1443-leader-recognition.yml'
      - 'scripts/patch-v1443-leader-recognition.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.42 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.42 -p escala-de-proposito-cpanel.zip --dir base --clobber
          mkdir pkg
          unzip -q base/escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.42"

      - name: Apply leader recognition fix
        run: |
          set -euo pipefail
          python scripts/patch-v1443-leader-recognition.py

      - name: Validate v1.4.43
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.43"
          ASSET=$(find pkg/assets -maxdepth 1 -name 'index-*.js' | head -n 1)
          test -n "$ASSET"
          node --check "$ASSET"
          grep -Fq 'Ae[id]="lider"' "$ASSET"
          grep -Fq 'Ae.lider_id===fe.id' "$ASSET"
          grep -Fq 'reconhecer automaticamente como **Líder**' pkg/ATUALIZACAO-v1.4.43.md

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip SHA256-v1.4.43.txt
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.43.txt

      - name: Publish v1.4.43
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.43 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.43 \
            escala-de-proposito-cpanel.zip \
            escalastop-cpanel.zip \
            SHA256-v1.4.43.txt \
            --target "$GITHUB_SHA" \
            --title 'Escala de Propósito v1.4.43' \
            --notes-file pkg/ATUALIZACAO-v1.4.43.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.43
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.43.txt
          retention-days: 30
