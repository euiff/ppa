name: Publish Escalas Top v1.3.1

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/publish-v1.3.1.yml"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download validated v1.3.1 artifact
        run: |
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-67a4-820e-a43c-4e04f536faeb/raw?se=2026-09-02T14%3A20%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=37e9d877-d806-56a1-bce4-3ad2be97e361&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T10%3A46%3A06Z&ske=2026-09-03T10%3A46%3A06Z&sks=b&skv=2026-02-06&sig=mMCb3gDhXnliAarMEAbr8jXw4kFjObgH1rcV1FbreFw%3D' -o artifact.zip
          unzip -q artifact.zip -d artifact
          test -f artifact/escalastop-cpanel-v1.3.1.zip
          cp artifact/escalastop-cpanel-v1.3.1.zip escalastop-cpanel.zip
          echo 'f7a1e08e660a17833c577f43036b46d61c8c405530eab32eabba1af4b7154739  escalastop-cpanel.zip' | sha256sum -c -
          unzip -t escalastop-cpanel.zip
          unzip -p escalastop-cpanel.zip VERSION | grep -qx '1.3.1'
          unzip -l escalastop-cpanel.zip | grep -q 'api/quiz_router_v131.php'
          unzip -l escalastop-cpanel.zip | grep -q 'database/migrations/202609020001_quiz_state_v131.sql'
          ! unzip -l escalastop-cpanel.zip | grep -q 'api/config.php'
          ! unzip -l escalastop-cpanel.zip | grep -q 'api/webhook.php'

      - name: Publish v1.3.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Escalas Top v1.3.1

          - Corrige o erro de chave duplicada ao fazer avaliação manual pelo Felicitômetro.
          - A avaliação manual atualiza o quiz e a avaliação existentes em vez de criar registros duplicados.
          - Mensagens fromMe da Evolution deixam de ser interpretadas como resposta de voluntário.
          - Quiz ativo tem prioridade sobre confirmação de escala, evitando a mensagem incorreta de “nenhuma escala pendente”.
          - Responder “não estive” conclui o quiz imediatamente e aparece no painel.
          - Responder a nota de 1 a 5 conclui o quiz; sugestão deixa de ser etapa obrigatória.
          - Sessões de quiz incompletas aparecem como “Em andamento”.
          - Quizzes antigos presos na etapa de sugestão são finalizados automaticamente após a janela de recuperação.
          - Limpa mensagens automáticas que foram gravadas indevidamente como sugestão/feedback.
          - O CRON instala com backup um roteador seguro antes do webhook existente, preservando os demais fluxos.
          - Mantém todas as correções anteriores de automações, check-in/check-out, mapa, PDF, repertório, mobile e atualizador.
          EOF
          gh release create v1.3.1 escalastop-cpanel.zip --title "Escalas Top v1.3.1" --notes-file notes.md
