name: Publish Escalas Top v1.3.6 Tested

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-v1.3.6.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact tested artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-4430-820e-af0f-8062bd9bc288/raw?se=2026-09-03T01%3A05%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=168ad36c-3f0b-5fd7-841e-40e99d5c2628&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T12%3A47%3A09Z&ske=2026-09-03T12%3A47%3A09Z&sks=b&skv=2026-02-06&sig=eYpL%2B1/jeaKQCyHYi9%2BvYsNU%2B9Iw2ypeZkTMXqsuXmk%3D' -o artifact.zip
          rm -rf artifact && mkdir artifact
          unzip -q artifact.zip -d artifact
          test -f artifact/escalastop-cpanel-v1.3.6.zip
          echo 'cffe68c53ebb94990fef1dc0d309c49a476ee70024b4976be4b9eb18ac8573fb  artifact/escalastop-cpanel-v1.3.6.zip' | sha256sum -c -
          unzip -t artifact/escalastop-cpanel-v1.3.6.zip
          test "$(unzip -p artifact/escalastop-cpanel-v1.3.6.zip VERSION | tr -d '\r\n')" = '1.3.6'
          cp artifact/escalastop-cpanel-v1.3.6.zip escalastop-cpanel.zip

      - name: Publish official public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          Escalas Top v1.3.6

          - A confirmação 1/2 é vinculada primeiro ao log EXATO da notificação que o sistema enviou para aquele WhatsApp.
          - Usa o escala_item_id gravado na notificação; se necessário, usa o token do próprio link /confirmar/ como segunda chave exata.
          - Corrige a deduplicação antecipada da v1.3.5 que podia consumir a resposta antes de localizar a escala.
          - Impede o webhook antigo de responder falsamente que não existe escala quando a resposta 1/2 já foi recebida pelo novo fluxo.
          - Remove a reinjeção do roteador antigo e mantém quiz, troca, justificativas e demais fluxos.
          - Inclui diagnóstico interno do webhook para eventos inesperados da Evolution.
          - Pacote publicado somente após testes PHP, regressão com dois voluntários, integração do webhook, build do frontend e integridade do ZIP passarem.

          SHA-256: cffe68c53ebb94990fef1dc0d309c49a476ee70024b4976be4b9eb18ac8573fb
          EOF
          if gh release view v1.3.6 >/dev/null 2>&1; then
            gh release delete v1.3.6 --yes --cleanup-tag
          fi
          gh release create v1.3.6 escalastop-cpanel.zip --title 'Escalas Top v1.3.6' --notes-file release-notes.md

      - name: Verify published asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.3.6 --json tagName,name,isDraft,isPrerelease,assets
