name: Publish Escalas Top v1.3.6 Tested

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-v1.3.6.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate exact tested artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-37c0-820e-b42a-8ed3b26155a8/raw?se=2026-09-03T01%3A36%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=4b713aa0-eeb1-5991-8e8c-bd81854613d8&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T11%3A07%3A08Z&ske=2026-09-03T11%3A07%3A08Z&sks=b&skv=2026-02-06&sig=Ll1U3g2TCg5rMa0fp8drIZGRN/6SsQT7G7%2B3dK9REDg%3D' -o artifact.zip
          rm -rf artifact && mkdir artifact
          unzip -q artifact.zip -d artifact
          test -f artifact/escalastop-cpanel-v1.3.6.zip
          echo 'cffe68c53ebb94990fef1dc0d309c49a476ee70024b4976be4b9eb18ac8573fb  artifact/escalastop-cpanel-v1.3.6.zip' | sha256sum -c -
          unzip -t artifact/escalastop-cpanel-v1.3.6.zip
          test "$(unzip -p artifact/escalastop-cpanel-v1.3.6.zip VERSION | tr -d '\r\n')" = '1.3.6'
          cp artifact/escalastop-cpanel-v1.3.6.zip escalastop-cpanel.zip
      - name: Publish public update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          Escalas Top v1.3.6

          - Confirmação 1/2 vinculada à notificação exata enviada para o voluntário.
          - Usa escala_item_id ou token do link /confirmar/ como chave exata.
          - Corrige deduplicação antecipada e falso retorno de escala inexistente.
          - Mantém quiz, trocas, justificativas, mapa, CRON e demais recursos.
          - Pacote aprovado pelos testes de regressão e build de produção.

          SHA-256: cffe68c53ebb94990fef1dc0d309c49a476ee70024b4976be4b9eb18ac8573fb
          EOF
          if gh release view v1.3.6 >/dev/null 2>&1; then gh release delete v1.3.6 --yes --cleanup-tag; fi
          gh release create v1.3.6 escalastop-cpanel.zip --title 'Escalas Top v1.3.6' --notes-file notes.md
      - name: Verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view v1.3.6 --json tagName,name,isDraft,isPrerelease,assets
