name: Publish Escala de Proposito v1.4.72 WhatsApp Group Reminders

on:
  push:
    paths:
      - '.github/workflows/publish-v1472-whatsapp-group-reminders.yml'
      - 'scripts/v1472-patch.b64.part*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.71 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.71 -p escala-de-proposito-cpanel.zip --dir base --clobber
          echo 'c7244107f053df1467f9e83cad8708579d22484081b3145a597e50f5023f24f4  base/escala-de-proposito-cpanel.zip' | sha256sum --check --strict
          mkdir pkg
          unzip -q base/escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.71"

      - name: Rebuild and apply v1.4.72 patch
        run: |
          set -euo pipefail
          cat scripts/v1472-patch.b64.part* | tr -d '\r\n' | base64 -d > /tmp/patch-v1472-whatsapp-group-reminders.py
          python3 -m py_compile /tmp/patch-v1472-whatsapp-group-reminders.py
          python3 /tmp/patch-v1472-whatsapp-group-reminders.py

      - name: Validate v1.4.72
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.72"
          ASSET=$(find pkg/assets -maxdepth 1 -name 'index-*.js' | head -n 1)
          test -n "$ASSET"

          node --check pkg/whatsapp-group-settings-v1472.js
          node --check "$ASSET"
          php -l pkg/api/whatsapp_group_reminder_v1472.php
          php -l pkg/api/whatsapp-group-v1472.php
          php -l pkg/api/automation_v130.php

          grep -Fq 'v1472_group_reminders' pkg/api/whatsapp_group_reminder_v1472.php
          grep -Fq 'v1472_group_reminders' pkg/api/automation_v130.php
          grep -Fq 'whatsapp_group_enabled' pkg/api/whatsapp-group-v1472.php
          grep -Fq '/group/fetchAllGroups/' pkg/api/whatsapp_group_reminder_v1472.php
          grep -Fq '/message/sendMedia/' pkg/api/whatsapp_group_reminder_v1472.php
          grep -Fq 'pendentes_texto' pkg/api/whatsapp_group_reminder_v1472.php
          grep -Fq 'whatsapp_group_reminder_logs' pkg/api/whatsapp_group_reminder_v1472.php
          grep -Fq 'whatsapp-group-settings-v1472.js?v=1.4.72' pkg/sistema.html
          grep -Eq 'src="/assets/index-[^"]+\.js\?v=1\.4\.72"' pkg/sistema.html
          grep -Fq '/app-notifications-v1465.js?v=1.4.72' pkg/sistema.html
          grep -Fq 'escala-version:1.4.72' pkg/sw.js
          grep -Fq 'Grupo de WhatsApp da igreja' pkg/whatsapp-group-settings-v1472.js
          grep -Fq 'Carregar grupos' pkg/whatsapp-group-settings-v1472.js
          grep -Fq 'Enviar teste' pkg/whatsapp-group-settings-v1472.js
          grep -Fq '{link_confirmacao}' pkg/whatsapp-group-settings-v1472.js

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip SHA256-v1.4.72.txt
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.72.txt

      - name: Publish v1.4.72
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.72 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.72 \
            escala-de-proposito-cpanel.zip \
            escalastop-cpanel.zip \
            SHA256-v1.4.72.txt \
            --target "$GITHUB_SHA" \
            --title 'Escala de Propósito v1.4.72' \
            --notes-file pkg/ATUALIZACAO-v1.4.72.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.72
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.72.txt
          retention-days: 30
