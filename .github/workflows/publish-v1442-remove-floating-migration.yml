name: Publish Escala de Proposito v1.4.42 Remove Floating Migration

on:
  push:
    paths:
      - '.github/workflows/publish-v1442-remove-floating-migration.yml'
      - 'scripts/patch-v1442-remove-floating-migration.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.4.41 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.4.41 -p escala-de-proposito-cpanel.zip --dir base --clobber
          mkdir pkg
          unzip -q base/escala-de-proposito-cpanel.zip -d pkg
          test "$(cat pkg/VERSION)" = "1.4.41"

      - name: Remove floating migration button
        run: |
          set -euo pipefail
          python scripts/patch-v1442-remove-floating-migration.py

      - name: Validate v1.4.42
        run: |
          set -euo pipefail
          test "$(cat pkg/VERSION)" = "1.4.42"
          node --check pkg/master-migration-entry.js
          grep -Fq "function addSidebar" pkg/master-migration-entry.js
          grep -Fq "removeQuickButton" pkg/master-migration-entry.js
          ! grep -Fq "b.textContent='⇄ Migração Supabase'" pkg/master-migration-entry.js
          grep -Fq '/master-migration-entry.js?v=1442' pkg/sistema.html
          grep -Fq 'Remove o botão flutuante' pkg/ATUALIZACAO-v1.4.42.md

      - name: Build release packages
        run: |
          set -euo pipefail
          rm -f escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          (cd pkg && zip -qr ../escala-de-proposito-cpanel.zip .)
          cp escala-de-proposito-cpanel.zip escalastop-cpanel.zip
          unzip -t escala-de-proposito-cpanel.zip >/dev/null
          sha256sum escala-de-proposito-cpanel.zip | tee SHA256-v1.4.42.txt

      - name: Publish v1.4.42
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.4.42 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.42 \
            escala-de-proposito-cpanel.zip \
            escalastop-cpanel.zip \
            SHA256-v1.4.42.txt \
            --target "$GITHUB_SHA" \
            --title 'Escala de Propósito v1.4.42' \
            --notes-file pkg/ATUALIZACAO-v1.4.42.md

      - uses: actions/upload-artifact@v4
        with:
          name: escala-de-proposito-cpanel-v1.4.42
          path: |
            escala-de-proposito-cpanel.zip
            escalastop-cpanel.zip
            SHA256-v1.4.42.txt
          retention-days: 30
